<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reddit Authenticity Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
:root{
  --bg:#dae0e6; --card:#ffffff; --card-2:#f6f7f8; --border:#ccc; --border-soft:#edeff1;
  --text:#1c1c1c; --muted:#7c7c7c; --link:#0079d3; --brand:#ff4500; --vote:#878a8c;
  --ok:#1a7f37; --ok-bg:#dafbe1; --warn:#9a6700; --warn-bg:#fff4c5; --bad:#cf222e; --bad-bg:#ffe1e1;
  --na:#6e7781; --na-bg:#eaeef2; --shadow:0 4px 16px rgba(0,0,0,.18);
  --n1:#2a78d6; --n2:#eb6834; --n3:#1b9e77; --nother:#a3a8b0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#030303; --card:#1a1a1b; --card-2:#272729; --border:#343536; --border-soft:#2a2a2c;
    --text:#d7dadc; --muted:#818384; --link:#4fbcff; --vote:#818384;
    --ok:#4ac26b; --ok-bg:#12301c; --warn:#d4a72c; --warn-bg:#3a2e0a; --bad:#ff7b72; --bad-bg:#3d1214;
    --na:#9198a1; --na-bg:#2a2e33; --shadow:0 4px 16px rgba(0,0,0,.6);
    --n1:#4f9cf0; --n2:#f07f4f; --n3:#36c49a; --nother:#5f646b;
  }
}
:root[data-theme="dark"]{
  --bg:#030303; --card:#1a1a1b; --card-2:#272729; --border:#343536; --border-soft:#2a2a2c;
  --text:#d7dadc; --muted:#818384; --link:#4fbcff; --vote:#818384;
  --ok:#4ac26b; --ok-bg:#12301c; --warn:#d4a72c; --warn-bg:#3a2e0a; --bad:#ff7b72; --bad-bg:#3d1214;
  --na:#9198a1; --na-bg:#2a2e33; --shadow:0 4px 16px rgba(0,0,0,.6);
  --n1:#4f9cf0; --n2:#f07f4f; --n3:#36c49a; --nother:#5f646b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);height:48px;display:flex;align-items:center;gap:12px;padding:0 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--text);cursor:pointer}
.logo .snoo{width:32px;height:32px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:16px}
.search{flex:1;max-width:560px;margin:0 auto;background:var(--card-2);border:1px solid var(--border-soft);border-radius:20px;padding:7px 14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shield-toggle{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card-2);border-radius:20px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.shield-toggle[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}

/* layout */
.wrap{max-width:1000px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:24px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.side{order:-1}}
.card{background:var(--card);border:1px solid var(--border);border-radius:4px}

/* feed */
.sortbar{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--border);border-radius:20px;padding:4px 12px;background:transparent;cursor:pointer;color:var(--muted);font-weight:600}
.chip.on{background:var(--card-2);color:var(--text)}
.post{display:flex;margin-bottom:10px;cursor:pointer;overflow:hidden}
.post:hover{border-color:var(--muted)}
.votes{width:40px;flex:none;background:var(--card-2);display:flex;flex-direction:column;align-items:center;padding:8px 0;color:var(--vote);font-weight:700;font-size:12px}
.votes .arr{font-size:16px;line-height:1}
.post-main{padding:8px;min-width:0;flex:1}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.meta .sub{font-weight:700;color:var(--text)}
.post h2{font-size:18px;font-weight:500;margin:6px 0 4px;line-height:1.3;overflow-wrap:anywhere}
.post .snip{color:var(--text);opacity:.85;max-height:4.4em;overflow:hidden;margin:4px 0;overflow-wrap:anywhere}
.linkdom{font-size:12px;color:var(--link)}
.actions{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:700;margin-top:6px;align-items:center}
.thread-health{display:inline-flex;align-items:center;gap:6px;border-radius:3px;padding:2px 6px;background:var(--card-2);font-weight:600}
.dots{display:inline-flex;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%;display:block}

/* author badge */
.u{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.u .name{color:var(--text)}
.u .name:hover{text-decoration:underline;cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:10px;padding:1px 7px 1px 5px;font-size:11px;font-weight:700;cursor:pointer;line-height:16px}
.badge .bars{display:inline-flex;gap:1px;align-items:flex-end;height:11px}
.badge .bars span{width:3px;border-radius:1px;background:currentColor;opacity:.9}
.badge .bars span.na{opacity:.25;height:3px!important}
.lv-ok{color:var(--ok);background:var(--ok-bg)}
.lv-warn{color:var(--warn);background:var(--warn-bg)}
.lv-bad{color:var(--bad);background:var(--bad-bg)}
.lv-na{color:var(--na);background:var(--na-bg)}
.shield-off .badge{display:none}
/* Candor score: the post's authenticity at a glance (top of every post; sticky in the thread view) */
.cscore{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font:600 12px/1.3 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--muted)}
.cscore .cs-brand{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-weight:800;font-size:12.5px}
.cscore .cs-num{display:inline-flex;align-items:baseline;gap:4px;border-radius:999px;padding:2px 9px;font-weight:800;font-size:13px}
.cscore .cs-num small{font-size:10.5px;font-weight:700;opacity:.85}
.cscore .cs-flag{color:var(--warn)}
.post .cscore{margin:0 0 6px}
.cscore.bar{position:sticky;top:48px;z-index:15;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:8px 12px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.cscore.bar .cs-num{font-size:15px;padding:3px 11px}
.cscore.bar .cs-title{flex:1 1 0;min-width:0;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cscore.bar .cs-more{margin-left:auto;font-weight:700}
.shield-off .cscore{display:none}
.side .hd .clogo{background:#fff;border-radius:4px;padding:3px 4px}

/* thread page */
.thread .post{cursor:default}
.thread .post:hover{border-color:var(--border)}
.thread .body{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
.comments{padding:8px 12px 16px}
.cmt{margin-top:12px}
.cmt .children{margin-left:10px;padding-left:12px;border-left:2px solid var(--border-soft)}
.cmt .text{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt .foot{font-size:12px;color:var(--muted);font-weight:700;display:flex;gap:12px}
.warnbox{display:flex;gap:8px;align-items:flex-start;border-radius:4px;padding:6px 10px;font-size:12px;margin:4px 0}
.warnbox b{font-weight:700}
.warnbox button{margin-left:auto;background:transparent;border:1px solid currentColor;border-radius:12px;padding:0 8px;cursor:pointer;color:inherit;font-size:11px;white-space:nowrap}
.cmt.collapsed > .text,.cmt.collapsed > .children,.cmt.collapsed > .foot{display:none}
.backlink{display:inline-block;margin-bottom:10px;font-weight:600}
.orphan{font-size:11px;color:var(--muted);font-style:italic}

/* sidebar */
.side .card{margin-bottom:16px;overflow:hidden}
.side .hd{background:var(--brand);color:#fff;padding:10px 12px;font-weight:700;display:flex;gap:8px;align-items:center}
.side .hd.shield{background:#0b6b3a}
.side .bd{padding:12px}
.side p{margin:0 0 10px}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0}
.legend{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;font-size:12px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:block}
.crit-list{font-size:12px;margin:0;padding:0;list-style:none}
.crit-list li{display:grid;grid-template-columns:28px 1fr 38px;gap:6px;padding:4px 0;border-top:1px solid var(--border-soft);align-items:center}
.crit-list li:first-child{border-top:0}
.slider{width:100%}

/* popover */
.pop{position:fixed;z-index:50;width:360px;max-width:calc(100vw - 32px);max-height:min(560px,calc(100vh - 32px));overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:14px;display:none}
.pop.open{display:block}
.pop .ph{display:flex;align-items:center;gap:10px}
.pop .av{width:40px;height:40px;border-radius:50%;background:var(--card-2);flex:none;object-fit:cover}
.pop .big{font-size:26px;font-weight:800;margin-left:auto;text-align:right;line-height:1}
.pop .big small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.pop .facts{font-size:12px;color:var(--muted);margin:6px 0 4px}
.crit{padding:8px 0;border-top:1px solid var(--border-soft)}
.crit .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}
.crit .q{font-size:12px;color:var(--muted);margin:1px 0 4px}
.meter{height:6px;background:var(--card-2);border-radius:3px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:3px}
.sig{font-size:12px;margin:4px 0 0;padding-left:16px}
.sig li{margin:1px 0}
.sig .pts{color:var(--bad);font-weight:700}
.closex{position:absolute;top:6px;right:8px;background:none;border:0;font-size:18px;cursor:pointer;color:var(--muted)}
.foot-note{font-size:11px;color:var(--muted);margin-top:8px}
.disclaimer{max-width:1000px;margin:0 auto 24px;padding:0 16px;font-size:11px;color:var(--muted);text-align:center}


/* live analyses: on phones the thread comes first, the summary sidebar after it */
@media (max-width:900px){body.live .side{order:1}}
/* narratives (live analyses) */
.nchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:10px;padding:0 7px;font-size:11px;font-weight:600;color:var(--muted);background:transparent;cursor:pointer;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nchip:hover,.nchip.on{border-color:var(--link);color:var(--link)}
.cmt.dim > .text,.cmt.dim > .meta,.cmt.dim > .foot,.cmt.dim > .warnbox{opacity:.35}
.narr{list-style:none;margin:0;padding:0}
.narr li{padding:8px 0;border-top:1px solid var(--border-soft)}
.narr li:first-child{border-top:0}
.narr button{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer;border-radius:4px}
.narr button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.narr .nl{font-weight:700;font-size:13px}
.narr .on .nl{color:var(--link)}
.narr .bar{height:6px;background:var(--card-2);border-radius:3px;overflow:hidden;margin:5px 0 3px}
.narr .bar span{display:block;height:100%;background:var(--link);border-radius:3px}
.narr .nm{font-size:12px;color:var(--muted)}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.kw span{font-size:11px;background:var(--card-2);border-radius:8px;padding:1px 7px;color:var(--muted)}
.notes{margin:0;padding-left:16px;font-size:12px;color:var(--muted)}
.notes li{margin:3px 0}
/* progress screen */
.prog{padding:20px}
.prog h2{margin:0 0 4px;font-size:18px}
.prog .url{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-bottom:14px}
.prog .track{height:8px;background:var(--card-2);border-radius:4px;overflow:hidden}
.prog .track span{display:block;height:100%;background:var(--link);border-radius:4px;transition:width .4s}
.prog .msg{margin-top:10px;font-size:13px}
.prog .err{color:var(--bad);font-weight:600}
.prog .btn{display:inline-block;margin-top:14px;border:0;border-radius:16px;padding:7px 16px;background:var(--link);color:#fff;font-weight:700;cursor:pointer}
.steps{margin:14px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.steps li{margin:4px 0}
.steps li.now{color:var(--text);font-weight:600}
.steps li.done{color:var(--ok)}
/* loading dancer */
.dance{display:flex;justify-content:center;margin:6px 0 14px;position:relative;height:150px}
.dancer{width:120px;height:150px;overflow:visible}
.dancer .bob{animation:bob .5s ease-in-out infinite alternate;transform-origin:60px 120px}
.dancer .armL{animation:armL .5s ease-in-out infinite alternate;transform-origin:38px 74px}
.dancer .armR{animation:armR .5s ease-in-out infinite alternate;transform-origin:82px 74px}
.dancer .legL{animation:legL 1s ease-in-out infinite;transform-origin:50px 112px}
.dancer .legR{animation:legR 1s ease-in-out infinite;transform-origin:70px 112px}
.dancer .pupil{animation:look 2s ease-in-out infinite}
.dancer .lens{animation:glint 1s ease-in-out infinite alternate}
.note{position:absolute;font-size:18px;color:var(--link);opacity:0;animation:note 2s linear infinite}
.note.n1{left:calc(50% + 46px);top:30px}.note.n2{left:calc(50% - 70px);top:50px;animation-delay:.7s}.note.n3{left:calc(50% + 60px);top:80px;animation-delay:1.3s}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-8px) rotate(6deg)}}
@keyframes armL{from{transform:rotate(30deg)}to{transform:rotate(-50deg)}}
@keyframes armR{from{transform:rotate(40deg)}to{transform:rotate(-30deg)}}
@keyframes legL{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
@keyframes legR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(0)}}
@keyframes look{0%,40%{transform:translateX(-2px)}50%,90%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
@keyframes glint{from{opacity:.25}to{opacity:.7}}
@keyframes note{0%{opacity:0;transform:translateY(10px) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-50px) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.dancer *,.note{animation:none!important}}
/* tooltips for numbers ([data-tip]) */
[data-tip]{cursor:help}
button[data-tip],a[data-tip],.badge[data-tip]{cursor:pointer}
.num{text-decoration:underline dotted var(--muted);text-underline-offset:2px}
.tipbox{position:fixed;z-index:80;max-width:280px;background:#1c1c1c;color:#fff;border-radius:6px;padding:6px 9px;font-size:12px;line-height:1.4;font-weight:500;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:var(--shadow)}
.tipbox.on{opacity:1}
:root[data-theme="dark"] .tipbox{background:#f0f0f0;color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tipbox{background:#f0f0f0;color:#111}}
/* narrative distribution pill */
.npill{all:unset;box-sizing:border-box;display:block;width:100%;max-width:560px;margin:10px 0 2px;padding:8px 10px;border:1px solid var(--border);border-radius:12px;cursor:pointer;background:var(--card)}
.npill:hover{border-color:var(--link)}
.npill:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.npill-hd{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.npill-hd .how{margin-left:auto;color:var(--link);font-weight:600}
.npill-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 6px;gap:2px;background:var(--card)}
.npill-bar span{display:block;height:100%;min-width:3px}
.npill-leg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--text)}
.npill-leg .pl{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%}
.npill-leg .pl em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.npill-leg i,.sw{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.npill-leg b{font-weight:700}
.npill.mini{max-width:none;margin:6px 0 0;padding:0;border:0;background:none;cursor:default}
.nchip .sw{width:7px;height:7px}
/* narrative modal (mini dashboard) */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{position:relative;background:var(--card);color:var(--text);border-radius:12px;box-shadow:var(--shadow);width:min(680px,100%);padding:18px 20px 20px}
.modal h2{margin:0 24px 2px 0;font-size:19px}
.modal .msub{color:var(--muted);font-size:13px;margin:0 0 6px;overflow-wrap:anywhere}
.modal .npill{max-width:none;cursor:default;border:0;padding:0;margin:8px 0 4px}
.modal .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0 4px}
.modal .kpi{background:var(--card-2);border-radius:8px;padding:8px 10px}
.modal .kpi b{display:block;font-size:20px;line-height:1.2}
.modal .kpi span{font-size:12px;color:var(--muted)}
.mrow{border-top:1px solid var(--border-soft);padding:12px 0}
.mrow .mh{display:flex;align-items:center;gap:8px;font-weight:700}
.mrow .mh .share{margin-left:auto;font-size:18px}
.mrow .mm{font-size:12px;color:var(--muted);margin:2px 0 6px 17px}
.mrow .ml{font-size:12px;font-weight:600;margin:6px 0 3px 17px}
.mrow .cbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-left:17px;background:var(--card-2)}
.mrow .cbar span{display:block;height:100%}
.mrow .cleg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted);margin:4px 0 0 17px}
.mrow .cleg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.mrow .hl{margin:8px 0 0 17px;font-size:12px;font-weight:600;border:1px solid var(--border);background:transparent;border-radius:12px;padding:3px 10px;cursor:pointer;color:var(--link)}
.howto{margin-top:6px;border-top:1px solid var(--border-soft);padding-top:10px;font-size:13px}
.howto summary{cursor:pointer;font-weight:700}
.howto ol{padding-left:18px;margin:8px 0 0}
.howto li{margin:6px 0}
.howto code{background:var(--card-2);border-radius:4px;padding:0 4px;font-size:12px}
.modal .closex{top:10px;right:12px}
.nsum{font-size:12.5px;line-height:1.45;color:var(--text);opacity:.9;margin:4px 0 2px}
.ai{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--link);margin-right:5px;vertical-align:1px}
.mrow .msum{font-size:13.5px;line-height:1.5;margin:4px 0 8px 17px}
a.post{color:inherit;text-decoration:none}
a.post:hover{text-decoration:none}
.gsum{font-size:13px;line-height:1.45;margin:6px 0 2px;color:var(--text);opacity:.9}
</style>
</head>
<body>
<nav class="cnav" aria-label="Candor">
  <a class="brand" href="/"><span class="clogo" aria-hidden="true"><i></i><i></i><i></i></span>Candor</a>
  <div class="tabs"><a href="/">Analyze</a><a href="/demo.html">Demo</a><a href="/dashboard.html">Dashboard</a><a href="/video.html">Video Demo</a></div>
  <div class="right"><button class="tour-btn" type="button" data-tour-start>? Tutorial</button></div>
</nav>
<header class="top">
  <div class="logo" onclick="location.hash=''"><div class="snoo">●</div><span>reddit</span></div>
  <div class="search" id="search">🔍 Search Reddit</div>
  <button class="shield-toggle" id="shieldBtn" aria-pressed="true" title="Toggle authenticity labels"><span class="clogo sm" aria-hidden="true"><i></i><i></i><i></i></span> <span>Authenticity labels on</span></button>
</header>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side"></aside>
</div>
<p class="disclaimer" id="disclaimer">Concept mockup for the Authenticity Scorer (Junction 2026). It is not affiliated with Reddit. Posts and comments come from a public scrape; scores come from profile_scores.json.</p>

<div class="pop" id="pop" role="dialog" aria-modal="false"></div>
<div class="modal-bg" id="nmodal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="nm-title"></div></div>
<div class="tipbox" id="tipbox" role="tooltip"></div>
<script src="tour.js"></script>

<script>
let DATA = /*__DATA__*/null;   // injected for the demo; fetched by ?id= for live analyses
let P = {}, T = [], W = {}, N = {};
const LIVE = () => DATA && DATA.meta.mode === "live";
const CRIT = {C1:"Profile",C2:"Originality",C3:"Coordination",C4:"Engagement",C5:"Behaviour"};
const LABEL = {likely_authentic:"Likely authentic",uncertain:"Uncertain",suspicious:"Suspicious",no_data:"No data"};
const LV = {likely_authentic:"ok",uncertain:"warn",suspicious:"bad",no_data:"na"};
const state = {shield:true, threshold:0, sort:"new", narrative:null};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lv = u => LV[(P[u]||{}).label] || "na";
const color = l => `var(--${l})`;
function ago(iso){
  if(!iso) return "";
  const s = (new Date(DATA.meta.scraped_at) - new Date(iso))/1000;
  if(s<3600) return Math.max(1,Math.round(s/60))+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago";
  if(s<86400*30) return Math.round(s/86400)+"d ago";
  if(s<86400*365) return Math.round(s/86400/30)+"mo ago";
  return Math.round(s/86400/365)+"y ago";
}
const fmt = n => n==null ? "•" : n>=10000 ? (n/1000).toFixed(1)+"k" : String(n);
const tip = t => ` data-tip="${esc(t)}"`;
const TIP = {
  score: "Authenticity score, 0–100: a weighted sum of five criteria (C1–C5). 70+ = likely authentic, 40–69 = uncertain, below 40 = suspicious. A red flag (any criterion at 20% or less) caps the label at uncertain.",
  postVotes: "The post's score on Reddit when we scraped it (upvotes minus downvotes).",
  weight: "Weight: this criterion's share of the overall score. The five weights add up to 100.",
  critPct: "How this account did on this criterion: 100% = no warning signs. Each signal listed below takes points off.",
  pts: "Points this signal took off the criterion's 100.",
  karma: "Total karma (post + comment) shown on the Reddit profile.",
  age: "Account age when we scraped it. A new account alone isn't suspicious, but it adds up with other signals (C1 Profile).",
};
/* Shares as whole percentages that add up to 100 (largest remainder). */
function pcts(shares){
  const tot = shares.reduce((a,b)=>a+b,0) || 1;
  const raw = shares.map(x=>x/tot*100), out = raw.map(Math.floor);
  let left = 100 - out.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(left>0){ out[i]++; left--; } });
  return out;
}
function md(s){
  let h = esc(s);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  h = h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/^&gt;\s?(.*)$/gm,'<span style="color:var(--muted)">│ $1</span>');
  return h;
}

/* ---------- badge ---------- */
function badge(u){
  const p = P[u];
  if(!p) return `<span class="badge lv-na"${tip(LIVE() ? "Not scored: we score the thread's most engaged commenters only." : "Not scored")}>?</span>`;
  const l = lv(u);
  const bars = ["C1","C2","C3","C4","C5"].map(k=>{
    const c = p.criteria[k];
    if(!c || !c.assessed) return `<span class="na"${tip(`${k} ${CRIT[k]}: couldn't be assessed (e.g. hidden history), so it counts as ${DATA.meta.unassessed_pct}%`)}></span>`;
    return `<span style="height:${Math.max(2,Math.round(c.pct/100*11))}px"${tip(`${k} ${CRIT[k]}: ${c.pct}% (weight ${W[k]})`)}></span>`;
  }).join("");
  const score = p.score==null ? "n/a" : Math.round(p.score);
  return `<button class="badge lv-${l}" data-user="${esc(u)}"${tip(`${LABEL[p.label]} · ${score}/100. Bars: C1 Profile, C2 Originality, C3 Coordination, C4 Engagement, C5 Behaviour. Click for the evidence.`)} aria-label="Authenticity ${score} for ${esc(u)}: ${LABEL[p.label]}">${l==="ok"?"✓":l==="na"?"–":"⚠"} ${score}<span class="bars">${bars}</span></button>`;
}
const user = u => `<span class="u"><a class="name" data-user="${esc(u)}" href="javascript:void 0">u/${esc(u)}</a>${badge(u)}</span>`;

/* ---------- popover ---------- */
const pop = document.getElementById("pop");
function openPop(u, anchor){
  const p = P[u]; if(!p) return;
  const l = lv(u);
  const facts = [];
  if(p.age_days!=null) facts.push(`<span class="num"${tip(TIP.age)}>${p.age_days<365?Math.round(p.age_days)+" days":(p.age_days/365).toFixed(1)+" yrs"} old</span>`);
  if(p.karma!=null) facts.push(`<span class="num"${tip(TIP.karma)}>${p.karma.toLocaleString()} karma</span>`);
  if(p.fetch && p.fetch!=="ok") facts.push(p.fetch.replace("_"," "));
  if(p.history===false) facts.push("history hidden");
  const crits = ["C1","C2","C3","C4","C5"].map(k=>{
    const c = p.criteria[k];
    if(!c) return "";
    const cl = !c.assessed ? "na" : c.pct>=80 ? "ok" : c.pct>=50 ? "warn" : "bad";
    const red = (p.red||[]).includes(k) ? ` <span style="color:var(--bad)">● red flag</span>` : "";
    const sig = c.signals.length ? `<ul class="sig">${c.signals.map(s=>`<li><span class="pts"${tip(TIP.pts)}>${s.points}</span> ${esc(s.why)}</li>`).join("")}</ul>` : "";
    return `<div class="crit"><div class="row"><span>${k} · ${CRIT[k]}${red}</span><span style="color:${color(cl)}"><span class="num"${tip(c.assessed?TIP.critPct:`Couldn't be assessed (e.g. hidden history); counts as ${DATA.meta.unassessed_pct}% in the total.`)}>${c.assessed?c.pct+"%":"not assessed"}</span> <span class="num" style="color:var(--muted);font-weight:400"${tip(TIP.weight)}>· w${c.weight}</span></span></div>
      <div class="q">${esc(c.name.split("—")[1]||c.name)}</div>
      <div class="meter"><span style="width:${c.assessed?c.pct:0}%;background:${color(cl)}"></span></div>${sig}</div>`;
  }).join("");
  pop.innerHTML = `<button class="closex" aria-label="Close">×</button>
    <div class="ph">${p.avatar?`<img class="av" src="${esc(p.avatar)}" alt="" onerror="this.style.visibility='hidden'">`:`<div class="av"></div>`}
      <div style="min-width:0"><div style="font-weight:700;overflow-wrap:anywhere">u/${esc(u)}</div><div class="facts">${facts.join(" · ")}</div></div>
      <div class="big" style="color:${color(l)}"${tip(TIP.score)}>${p.score==null?"–":Math.round(p.score)}<small>${LABEL[p.label]}</small></div></div>
    ${p.bio?`<div class="facts" style="color:var(--text)">${esc(p.bio)}</div>`:""}
    ${crits}
    <div class="foot-note">Score = weighted sum of C1–C5 (weights ${Object.entries(W).map(([k,v])=>k+" "+v).join(", ")}). Criteria that can't be assessed default to ${DATA.meta.unassessed_pct}%. Use the score as a prompt to check sources, not as proof.</div>`;
  pop.classList.add("open");
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(Math.max(16, r.left), innerWidth - pw - 16);
  let y = r.bottom + 6; if(y + ph > innerHeight - 16) y = Math.max(16, r.top - ph - 6);
  pop.style.left = x+"px"; pop.style.top = y+"px";
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-user]");
  if(t){ e.preventDefault(); e.stopPropagation(); openPop(t.dataset.user, t); return; }
  if(e.target.closest(".closex") || !e.target.closest("#pop")) pop.classList.remove("open");
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") pop.classList.remove("open"); });
addEventListener("scroll", ()=>pop.classList.remove("open"), {passive:true});

/* ---------- thread health ---------- */
const LOGO = `<span class="clogo sm" aria-hidden="true"><i></i><i></i><i></i></span>`;
const band = v => v==null ? "na" : v>=70 ? "ok" : v>=40 ? "warn" : "bad";
// The post's Candor score: average authenticity of its scored participants, plus how many are flagged.
// o = {mean, n, flagged, dots?, title?, more?}; bar = the sticky version for the thread view.
function candorScore(o, bar){
  const m = o.mean==null ? null : Math.round(o.mean), l = band(m);
  const why = m==null ? "No participant in this thread has an authenticity score yet."
    : `Candor score: the average authenticity (0–100) of the ${o.n} scored participants in this thread. 70+ likely authentic, 40–69 uncertain, below 40 suspicious.` + (o.flagged?` ${o.flagged} of them are flagged as uncertain or suspicious.`:"");
  return `<div class="cscore${bar?" bar":""}"${tip(why)}>
    <span class="cs-brand">${LOGO}Candor</span>
    <span class="cs-num lv-${l}">${m==null?"n/a":m}<small>/100</small></span>
    ${o.dots?`<span class="dots">${o.dots}</span>`:""}
    <span>${o.n} scored${o.flagged?` · <span class="cs-flag">${o.flagged} flagged</span>`:""}</span>
    ${bar && o.title?`<span class="cs-title">${esc(o.title)}</span>`:""}
    ${o.more||""}
  </div>`;
}
function threadScore(t){
  const us = threadAuthors(t).filter(u=>P[u]);
  const v = us.map(u=>P[u].score).filter(x=>x!=null);
  return {mean: v.length ? v.reduce((a,b)=>a+b,0)/v.length : null, n: us.length,
    flagged: us.filter(u=>["warn","bad"].includes(lv(u))).length,
    dots: us.slice(0,12).map(u=>`<i style="background:${color(lv(u))}"></i>`).join("")};
}
function threadAuthors(t){
  const s = new Set(t.comments.map(c=>c.author)); if(t.author) s.add(t.author); return [...s];
}
function health(t){
  const us = threadAuthors(t).filter(u=>P[u]);
  const flagged = us.filter(u=>["warn","bad"].includes(lv(u))).length;
  const dots = us.slice(0,12).map(u=>`<i style="background:${color(lv(u))}"></i>`).join("");
  const why = `${us.length} participants in this thread have an authenticity score; each dot is one of them (green likely authentic, amber uncertain, red suspicious).` + (flagged?` ${flagged} are flagged as uncertain or suspicious.`:"");
  return `<span class="thread-health"${tip(why)}>${LOGO} <span class="dots">${dots}</span> ${us.length} scored${flagged?` · <span style="color:var(--warn)">${flagged} flagged</span>`:""}</span>`;
}

/* ---------- views ---------- */
function postCard(t, full){
  const by = t.author ? `Posted by ${user(t.author)}` : `<span>Link post · OP not in dataset</span>`;
  const n = t.num_comments ?? t.comments.length;
  let dom = "";
  if(t.link){ try{ dom = `<a class="linkdom" href="${esc(t.link)}" target="_blank" rel="noopener">${esc(new URL(t.link).hostname)} ↗</a>`; }catch(_){} }
  const body = t.body ? (full ? `<div class="body">${md(t.body)}</div>` : `<div class="snip">${esc(t.body.slice(0,300))}</div>`) : "";
  return `<article class="card post" data-thread="${t.id}">
    <div class="votes"><span class="arr">▲</span><span${tip(TIP.postVotes)}>${fmt(t.score)}</span><span class="arr">▼</span></div>
    <div class="post-main">
      ${full ? "" : candorScore(threadScore(t))}
      <div class="meta"><span class="sub">r/${esc(t.sub)}</span><span>•</span>${by}<span>${ago(t.posted_at)}</span></div>
      <h2>${esc(t.title)}</h2>${dom}${body}
      ${full && LIVE() ? pill() : ""}
      <div class="actions"><span>💬 ${n} Comments</span>${full ? "" : health(t)}</div>
    </div></article>`;
}
function renderFeed(){
  let ts = [...T];
  if(state.sort==="flagged") ts.sort((a,b)=>flagShare(b)-flagShare(a));
  else if(state.sort==="top") ts.sort((a,b)=>threadAuthors(b).length-threadAuthors(a).length);
  document.getElementById("main").innerHTML =
    `<div class="card sortbar">${[["new","New"],["top","Most discussed"],["flagged","Most flagged"]].map(([k,l])=>`<button class="chip ${state.sort===k?"on":""}" data-sort="${k}">${l}</button>`).join("")}
     <span style="margin-left:auto;font-size:12px;color:var(--muted)">Topic: ${esc(DATA.meta.topic)}</span></div>` +
    ts.map(t=>postCard(t,false)).join("");
}
function flagShare(t){ const us=threadAuthors(t); return us.filter(u=>["warn","bad"].includes(lv(u))).length + (100-avg(us))/100; }
function avg(us){ const v=us.map(u=>P[u]?.score).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : 100; }

function warnFor(u){
  const p = P[u]; if(!p) return "";
  const l = lv(u); if(l==="ok") return "";
  const reasons = Object.entries(p.criteria).flatMap(([k,c])=>c.signals.filter(s=>s.points<=-20).map(s=>s.why)).slice(0,2);
  return `<div class="warnbox lv-${l}">⚠<div><b>${LABEL[p.label]} account (${p.score==null?"n/a":Math.round(p.score)}/100).</b> ${esc(reasons.join(" · ")||"Not enough data to assess.")}</div><button data-collapse>Hide</button></div>`;
}
function renderThread(id){
  const t = T.find(x=>x.id===id); if(!t){ location.hash=""; return; }
  const byId = Object.fromEntries(t.comments.map(c=>[c.id,{...c,kids:[]}]));
  const roots = [];
  for(const c of Object.values(byId)){
    if(c.parent && byId[c.parent]) byId[c.parent].kids.push(c);
    else { c.orphan = c.parent && c.parent!==t.id; roots.push(c); }
  }
  const below = u => state.threshold>0 && P[u] && P[u].score!=null && P[u].score < state.threshold;
  const dim = c => state.narrative!==null && c.narrative!==state.narrative;
  const node = c => {
    const hide = below(c.author);
    return `<div class="cmt ${hide?"collapsed":""} ${dim(c)?"dim":""}" id="c-${c.id}">
      <div class="meta">${user(c.author)}<span>· ${ago(c.posted_at)}</span>${narrChip(c.narrative)}${hide?`<span>· hidden by your threshold <a href="javascript:void 0" data-expand>show</a></span>`:""}</div>
      ${state.shield?warnFor(c.author):""}
      ${c.orphan?`<div class="orphan">↳ reply to a comment from an account outside the dataset</div>`:""}
      <div class="text">${md(c.body)}</div>
      <div class="foot"><span>▲ ${fmt(c.score)} ▼</span><span>Reply</span><span>Share</span></div>
      ${c.kids.length?`<div class="children">${c.kids.map(node).join("")}</div>`:""}
    </div>`;
  };
  const back = FROM_DEMO ? `<a class="backlink" href="/demo.html">← Demo feed</a>` : LIVE() ? `<a class="backlink" href="/">← Your analyses</a>` : `<a class="backlink" href="#">← Back to feed</a>`;
  const shown = LIVE()
    ? `Showing ${t.comments.length} comments captured${DATA.meta.reported_comments?` of ${DATA.meta.reported_comments}`:""} · ${Object.keys(P).length} most engaged commenters scored`
    : `Showing ${t.comments.length} comments from scored accounts`;
  const more = LIVE() ? `<a class="cs-more" href="javascript:void 0" data-pill>Breakdown ›</a>` : "";
  document.getElementById("main").innerHTML = `<div class="thread">${back}
    ${candorScore({...threadScore(t), title: t.title, more}, true)}
    ${postCard(t,true)}
    ${t.author && state.shield ? `<div class="card" style="padding:0 12px;margin:-4px 0 10px">${warnFor(t.author)}</div>`:""}
    <div class="card comments"><div class="meta">${shown} · <a href="${esc(t.url)}" target="_blank" rel="noopener">original thread ↗</a></div>
    ${roots.map(node).join("") || `<p style="color:var(--muted)">No comments from scored accounts.</p>`}</div></div>`;
  if(!state.keepScroll) scrollTo(0,0);
  state.keepScroll = false;
}
function narrChip(id){
  if(!LIVE() || id==null || !N[id]) return "";
  const on = state.narrative===id ? " on" : "";
  return `<button class="nchip${on}" data-narr="${id}"${tip(`Narrative: ${N[id].label} (${Math.round(N[id].weighted_share*100)}% of the thread's engagement). Click to highlight its comments.`)}><i class="sw" style="background:${ncolor(id)}"></i>${esc(N[id].label)}</button>`;
}

/* ---------- sidebar ---------- */
function renderSide(){
  const s = DATA.meta.summary, lc = s.label_counts, tot = Object.values(lc).reduce((a,b)=>a+b,0);
  const order = ["likely_authentic","uncertain","suspicious","no_data"];
  const BAND = {likely_authentic:"score 70+ and no red flag", uncertain:"score 40–69, or 70+ with a red flag (a criterion at 20% or less)", suspicious:"score below 40, or suspended by Reddit", no_data:"profile couldn't be fetched (deleted, private or timed out)"};
  const dist = order.map(k=>`<span style="width:${(lc[k]||0)/tot*100}%;background:${color(LV[k])}"${tip(`${LABEL[k]}: ${lc[k]||0} of ${tot} scored accounts (${Math.round((lc[k]||0)/tot*100)}%)`)}></span>`).join("");
  const leg = order.map(k=>`<i style="background:${color(LV[k])}"></i><span>${LABEL[k]}</span><b class="num"${tip(`${lc[k]||0} accounts labelled ${LABEL[k].toLowerCase()}: ${BAND[k]}.`)}>${lc[k]||0}</b>`).join("");
  const CDESC = {C1:"C1 Account profile: is this an established, real person?", C2:"C2 Content originality: did this person write it?", C3:"C3 Coordination: is it acting in concert with others?", C4:"C4 Engagement legitimacy: did it earn its karma?", C5:"C5 Behavioural history: does the account do this elsewhere?"};
  const crit = ["C1","C2","C3","C4","C5"].map(k=>`<li><b>${k}</b><span${tip(CDESC[k]+" "+TIP.weight)}>${CRIT[k]} <span style="color:var(--muted)">(w${W[k]})</span></span><span class="num" style="text-align:right"${tip(`Average ${k} score across the ${s.scored} scored accounts. 100% = no warning signs.`)}>${s.mean_criterion_pct[k]}%</span></li>`).join("");
  document.getElementById("side").innerHTML = (LIVE() ? narrativesCard() : "") + `
    <div class="card" id="shieldCard"><div class="hd shield">${LOGO} Authenticity Shield</div><div class="bd">
      <p>${LIVE() ? "The thread's most engaged commenters are" : "Every account here is"} scored 0–100 on five signals of authentic behaviour. Click any badge to see why.</p>
      <div class="dist">${dist}</div><div class="legend">${leg}</div>
      <p style="margin-top:12px;font-size:12px;color:var(--muted)"><span class="num"${tip("The average authenticity score (0–100) of the scored accounts. "+TIP.score)}>Mean score ${s.mean_score}</span> across ${s.scored} scored profiles</p>
      <ul class="crit-list">${crit}</ul>
    </div></div>
    <div class="card" id="filterCard"><div class="hd shield">🎚️ Filter comments</div><div class="bd">
      <label for="thr" style="font-size:13px">Collapse comments from accounts scoring below <b id="thrv">${state.threshold||"off"}</b></label>
      <input class="slider" id="thr" type="range" min="0" max="95" step="5" value="${state.threshold}">
    </div></div>
    <div class="card"><div class="bd" style="font-size:12px;color:var(--muted)">
      <b style="color:var(--text)">How to read a badge</b><br>✓/⚠ + overall score, then five bars for C1–C5. A short bar means that criterion lost points; a dot means it couldn't be assessed (e.g. hidden history). A low score is a reason to check sources, not proof of a bot.
    </div></div>` + (LIVE() ? notesCard() : "");
  document.getElementById("thr").addEventListener("input", e=>{
    state.threshold = +e.target.value; document.getElementById("thrv").textContent = state.threshold||"off";
    // live analyses show their one thread without a #/t/ hash; keep the reader's place
    if(location.hash.startsWith("#/t/") || LIVE()){ state.keepScroll = true; route(); }
  });
}

function narrativesCard(){
  const ns = DATA.narratives || [];
  const li = ns.map(n=>{
    const on = state.narrative===n.id ? " on" : "";
    const sc = n.mean_score==null ? "no scored commenters" : `<span class="num"${tip(`Average authenticity score of the ${n.n_scored} scored accounts that commented in this narrative (of ${n.n_authors} accounts in it).`)}>avg authenticity ${Math.round(n.mean_score)}</span> (${n.n_scored} scored)`;
    const fl = n.flagged.length ? ` · <span style="color:var(--warn)"${tip("Accounts in this narrative labelled uncertain or suspicious: u/"+n.flagged.join(", u/"))}>${n.flagged.length} flagged</span>` : "";
    return `<li class="${on}"><button data-narr="${n.id}" aria-pressed="${!!on}">
      <div class="nl"><i class="sw" style="background:${ncolor(n.id)};margin-right:6px"></i>${esc(n.label)}</div>
      ${n.summary?`<div class="nsum"><span class="ai"${tip(AI_TIP)}>AI summary</span>${esc(n.summary)}</div>`:""}
      <div class="bar"><span style="width:${Math.max(2,Math.round(n.weighted_share*100))}%;background:${ncolor(n.id)}"></span></div>
      <div class="nm"><span class="num"${tip(`Share of the thread's engagement: each comment counts log(1+upvotes) + ½·log(1+replies), so popular comments weigh more without one viral comment drowning out the rest. ${Math.round(n.share*100)}% of comments.`)}>${Math.round(n.weighted_share*100)}% of engagement</span> · ${n.n_comments} comments · ${sc}${fl}</div></button></li>`;
  }).join("");
  const kw = (DATA.meta.topic_keywords||[]).slice(0,10).map(k=>`<span>${esc(k)}</span>`).join("");
  return `<div class="card" id="narrCard"><div class="hd">🧭 Narratives in this thread</div><div class="bd">
    <p style="font-size:12px;color:var(--muted)">Comments grouped by what they argue, sized by engagement (upvotes and replies). Click one to highlight its comments.</p>
    <ul class="narr">${li}</ul>
    ${kw?`<div style="font-size:12px;color:var(--muted);margin-top:10px"${tip("Words that set this thread apart from its commenters' other activity. Used to check whether an account posts about nothing but this topic (C5).")}>Thread topic keywords</div><div class="kw">${kw}</div>`:""}
    <p style="margin:12px 0 0;display:flex;gap:12px;flex-wrap:wrap"><a href="javascript:void 0" data-pill>Breakdown &amp; method</a><a id="mapLink" href="${esc(DATA.meta.map_url)}" target="_blank" rel="noopener">Open the narrative map ↗</a></p>
  </div></div>`;
}
function notesCard(){
  const w = DATA.meta.warnings || [];
  return w.length ? `<div class="card"><div class="hd">ℹ️ About this analysis</div><div class="bd"><ul class="notes">${w.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>` : "";
}
document.getElementById("side").addEventListener("click", e=>{
  const n = e.target.closest("[data-narr]"); if(!n || e.target.closest("[data-user]")) return;
  toggleNarrative(+n.dataset.narr);
});
function toggleNarrative(id){
  state.narrative = state.narrative===id ? null : id;
  state.keepScroll = true;
  renderSide(); route();
}

/* ---------- narrative distribution (pill + mini dashboard) ---------- */
const NCOL = ["var(--n1)","var(--n2)","var(--n3)"], OCOL = "var(--nother)", NOISE = -1;
let PARTS = [];
/* Top 3 narratives by engagement share + "Others" (smaller narratives and unclustered comments).
   Mirrors candor/view.py distribution(). */
function pillParts(){
  const ns = DATA.narratives || [];
  const top = ns.filter(n=>n.id!==NOISE).sort((a,b)=>b.weighted_share-a.weighted_share).slice(0,3);
  const parts = top.map((n,i)=>({id:n.id, label:n.label, share:n.weighted_share, color:NCOL[i]}));
  const rest = ns.reduce((a,n)=>a+n.weighted_share,0) - parts.reduce((a,x)=>a+x.share,0);
  if(rest>0.0005) parts.push({id:null, label:"Others", share:rest, color:OCOL});
  return parts;
}
const ncolor = id => (PARTS.find(x=>x.id===id && id!=null) || {color:OCOL}).color;
const AI_TIP = "Written by an LLM (NVIDIA Nemotron) from this narrative's most representative comments. It describes what commenters argue; it isn't a fact-check.";
const OTHERS_TIP = "Others = smaller narratives plus comments too short or off-topic to join one (jokes, one-word replies).";
function pill(parts = PARTS, interactive = true){
  if(!parts.length) return "";
  const PARTS_ = parts;
  const pc = pcts(parts.map(x=>x.share));
  if(!interactive){
    return `<div class="npill" style="cursor:inherit"><span class="npill-hd">🧭 Narrative distribution</span><span class="npill-bar">${parts.map((x,i)=>`<span style="flex:${x.share} 1 0;background:${x.color}"${tip(`${pc[i]}% · ${x.label}`)}></span>`).join("")}</span><span class="npill-leg">${parts.map((x,i)=>`<span class="pl"><i style="background:${x.color}"></i><em>${esc(x.label)}</em><b>${pc[i]}%</b></span>`).join("")}</span></div>`;
  }
  const segs = parts.map((x,i)=>`<span style="flex:${x.share} 1 0;background:${x.color}"${tip(`${pc[i]}% · ${x.label}${x.id==null?". "+OTHERS_TIP:""}`)}></span>`).join("");
  const leg = PARTS_.map((x,i)=>`<span class="pl"><i style="background:${x.color}"></i><em>${esc(x.label)}</em><b>${pc[i]}%</b></span>`).join("");
  return `<button class="npill" type="button" data-pill aria-haspopup="dialog" aria-label="Narrative distribution: ${esc(PARTS.map((x,i)=>x.label+" "+pc[i]+"%").join(", "))}. Open the breakdown.">
    <span class="npill-hd">🧭 Narrative distribution <span class="how">How is this computed? ›</span></span>
    <span class="npill-bar">${segs}</span><span class="npill-leg">${leg}</span></button>`;
}
/* Per pill part: comments, accounts and engagement by authenticity band (computed from the thread). */
const BANDS = [["ok","Likely authentic"],["warn","Uncertain"],["bad","Suspicious"],["na","Not scored"]];
function partStats(){
  const t = T[0], replies = {};
  t.comments.forEach(c=>{ replies[c.parent] = (replies[c.parent]||0) + 1; });
  const w = c => Math.log1p(Math.max(c.score||0,0)) + 0.5*Math.log1p(replies[c.id]||0);
  const key = id => PARTS.some(x=>x.id===id && id!=null) ? id : "others";
  const S = {}, all = {eng:{ok:0,warn:0,bad:0,na:0}, accounts:{}};
  for(const c of t.comments){
    if(c.narrative==null) continue;  // bots and deleted comments aren't clustered
    const k = key(c.narrative), b = lv(c.author);
    const st = S[k] ??= {comments:0, eng:{ok:0,warn:0,bad:0,na:0}, accounts:{}};
    st.comments++; st.eng[b] += w(c); st.accounts[c.author] = b;
    all.eng[b] += w(c); all.accounts[c.author] = b;
  }
  const count = acc => { const n = {ok:0,warn:0,bad:0,na:0}; Object.values(acc).forEach(b=>n[b]++); return n; };
  for(const st of [...Object.values(S), all]) st.byAcc = count(st.accounts);
  return {S, all};
}
function compBar(byAcc){
  const tot = Object.values(byAcc).reduce((a,b)=>a+b,0) || 1;
  return BANDS.filter(([k])=>byAcc[k]).map(([k,l])=>`<span style="width:${byAcc[k]/tot*100}%;background:var(--${k})"${tip(`${byAcc[k]} of ${tot} accounts: ${l.toLowerCase()}`)}></span>`).join("");
}

  const nScored = Object.keys(P).length, clustered = t.comments.filter(c=>c.narrative!=null).length;
  const noise = (DATA.narratives||[]).find(n=>n.id===NOISE);
  const rows = PARTS.map((x,i)=>{
    const st = S[x.id==null?"others":x.id] || {comments:0, byAcc:{ok:0,warn:0,bad:0,na:0}, eng:{ok:0,warn:0,bad:0,na:0}, accounts:{}};
    const nAcc = Object.keys(st.accounts).length, n = N[x.id];
    const leg = BANDS.map(([k,l])=>`<span><i style="background:var(--${k})"></i>${st.byAcc[k]} ${l.toLowerCase()}</span>`).join("");
    const kw = n && n.keywords.length ? ` · <span${tip("Words that set this narrative apart from the rest of the thread (c-TF-IDF).")}>${esc(n.keywords.slice(0,5).join(", "))}</span>` : "";
    return `<div class="mrow">
      <div class="mh"><i class="sw" style="background:${x.color}"></i><span>${esc(x.label)}</span><span class="share num"${tip(`${pc[i]}% of the thread's engagement`)}>${pc[i]}%</span></div>

      <div class="mm">${st.comments} comments · ${nAcc} accounts${kw}${x.id==null?`<br>${esc(OTHERS_TIP)}`:""}</div>

      ${x.id!=null?`<button class="hl" type="button" data-hl="${x.id}">Highlight in thread</button>`:""}
    </div>`;
  }).join("");
  const m = document.querySelector("#nmodal .modal");
  m.innerHTML = `<button class="closex" type="button" aria-label="Close">×</button>
    <h2 id="nm-title">Narrative distribution</h2>

    <div class="kpis">
      <div class="kpi"${tip("Narratives found: groups of comments that make the same point.")}><b>${(DATA.narratives||[]).filter(n=>n.id!==NOISE).length}</b><span>narratives</span></div>
      <div class="kpi"${tip(`Comments that went into the analysis (of ${t.comments.length} captured; bots and deleted comments are left out).`)}><b>${clustered}</b><span>comments analysed</span></div>
      <div class="kpi"${tip(`We score the ${nScored} most engaged commenters; the other ${Math.max(0,Object.keys(all.accounts).length-nScored)} accounts show as not scored.`)}><b>${nScored}</b><span>accounts scored</span></div>
      <div class="kpi"${tip("Share of all engagement in the thread that comes from accounts labelled likely authentic. Engagement from unscored accounts counts against this, so it's a lower bound.")}><b>${share(all.eng)}%</b><span>engagement from likely-authentic accounts</span></div>
    </div>
    ${rows}
    <details class="howto" open><summary>How is this computed?</summary><ol>
      <li><b>Read.</b> We captured ${t.comments.length} comments from the thread${DATA.meta.reported_comments>t.comments.length?` (Reddit reports ${DATA.meta.reported_comments}, but only renders the top of large threads)`:""}. Bots and deleted comments are dropped.</li>
      <li><b>Group by meaning.</b> Each comment is turned into an embedding (Gemini), placed on a map by meaning (UMAP) and clustered (HDBSCAN). Comments that make the same point form a narrative; an NVIDIA Nemotron model names it. ${noise?`${noise.n_comments} comments didn't fit any narrative and go into Others.`:""}</li>
      <li><b>Weigh by engagement.</b> Each comment counts <code>log(1 + upvotes) + ½ · log(1 + replies)</code>, so popular comments weigh more without one viral comment drowning the rest. A narrative's share is its comments' total over the whole thread's. The bar shows the 3 largest; the rest is Others.</li>
      <li><b>Check who's behind it.</b> We score the ${nScored} most engaged commenters 0–100 on five criteria (profile, originality, coordination, engagement, behaviour): 70+ likely authentic, 40–69 uncertain, below 40 suspicious. "Who pushes it" counts each narrative's accounts by that label.</li>
    </ol><p style="margin:8px 0 0;font-size:12px;color:var(--muted)">A narrative backed mostly by uncertain or suspicious accounts is a reason to look closer, not proof of manipulation.</p></details>
    <p style="margin:12px 0 0;font-size:13px"><a href="${esc(DATA.meta.map_url)}" target="_blank" rel="noopener">Open the full narrative map ↗</a> · dots sized by upvotes, faded by author authenticity</p>`;
  modalReturn = document.activeElement;

const tipbox = document.getElementById("tipbox");
let tipFor = null;
function showTip(el){
  tipFor = el; tipbox.textContent = el.dataset.tip; tipbox.classList.add("on");
  const r = el.getBoundingClientRect(), b = tipbox.getBoundingClientRect();
  let top = r.top - b.height - 8; if(top < 8) top = r.bottom + 8;
  tipbox.style.top = top + "px";
  tipbox.style.left = Math.max(8, Math.min(r.left + r.width/2 - b.width/2, innerWidth - b.width - 8)) + "px";
}
function hideTip(){ tipFor = null; tipbox.classList.remove("on"); }
document.addEventListener("mouseover", e=>{ const t = e.target.closest("[data-tip]"); if(t && t!==tipFor) showTip(t); else if(!t && tipFor) hideTip(); });

document.addEventListener("focusout", hideTip);

      <path d="M44 42 Q60 22 76 42" fill="#14182b"/><rect x="40" y="38" width="40" height="6" rx="3" fill="#14182b"/>
    </g>
  </svg><span class="note n1">♪</span><span class="note n2">♫</span><span class="note n3">♪</span></div>`;
// progress range of each pipeline step (candor/live.py); profiles and narratives run in parallel
const STEP_AT = [[0,.30],[.30,.80],[.30,.80],[.80,1.01]];
function progressView(a){
  const pct = Math.round((a.progress||0)*100);
  const err = a.status==="error";
  const live = document.querySelector(".prog[data-running]");
  if(!err && live){  // update in place so the dancer keeps dancing between polls
    live.querySelector("h2").textContent = a.status==="queued" ? "Queued…" : "Analysing this thread…";
    live.querySelector(".url").textContent = a.title || a.canonical_url || "";
    live.querySelector(".track span").style.width = pct + "%";
    live.querySelector(".track").setAttribute("aria-valuenow", pct);
    live.querySelector(".msg").textContent = `${pct}% · ${a.message||""}`;
    live.querySelectorAll(".steps li").forEach((li,i)=>{
      const p = a.progress||0, [from, to] = STEP_AT[i];
      li.className = p >= to ? "done" : p >= from ? "now" : "";
    });
    return;
  }
  document.getElementById("main").innerHTML = `<div class="card prog"${err?"":" data-running"}>${err?"":DANCER}
    <h2>${err ? "Analysis failed" : a.status==="queued" ? "Queued…" : "Analysing this thread…"}</h2>
    <div class="url">${esc(a.title || a.canonical_url || "")}</div>
    ${err ? `<div class="msg err">${esc(a.error||"Unknown error")}</div>${a.url?`<button class="btn" data-retry="${esc(a.url)}">Try again</button>`:""}`
          : `<div class="track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
             <div class="msg">${pct}% · ${esc(a.message||"")}</div>
             <ol class="steps"><li>Scrape the thread (context.dev)</li><li>Scrape the most engaged commenters' profiles</li><li>Group comments into narratives (Gemini embeddings + NVIDIA naming)</li><li>Score each account's authenticity</li></ol>
             <p style="font-size:12px;color:var(--muted);margin:12px 0 0">Usually 1–2 minutes. You can close this page; it stays under <a href="/">Your analyses</a>.</p>`}
  </div>`;
  document.getElementById("side").innerHTML = "";
  if(!err) progressView(a);  // mark the current step
}
async function retryAnalysis(url){
  const r = await fetch("/api/analyze", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url})});
  const j = await r.json().catch(()=>({}));
  if(r.ok) location.search = "?id=" + encodeURIComponent(j.id);
  else document.querySelector(".prog")?.insertAdjacentHTML("beforeend", `<div class="msg err">${esc(j.detail || "Could not start the analysis")}</div>`);
}
async function poll(){
  if(EXAMPLE){  // bundled analyses: web/example/ (tutorial) and web/examples/<name>/ (demo feed)
    const v = await fetch(AID==="example" ? "example/view.json" : `examples/${encodeURIComponent(AID.slice(3))}/view.json`).catch(()=>null);
    if(v && v.ok){ boot(await v.json()); return; }
    progressView({status:"error", error:"The example analysis isn't available."}); return;
  }
  try{
    const r = await fetch(`/api/analyses/${encodeURIComponent(AID)}`);
    if(r.status===404){ progressView({status:"error", error:"We couldn't find this analysis."}); return; }
    const a = await r.json();
    if(a.status==="done"){
      const v = await fetch(`/api/analyses/${encodeURIComponent(AID)}/view`);
      if(v.ok){ boot(await v.json()); return; }
    }
    progressView(a);
    if(a.status!=="error") setTimeout(poll, 1500);
  }catch(_){ setTimeout(poll, 3000); }
}
document.querySelectorAll(".cnav .tabs a").forEach(a=>{
  const href = a.getAttribute("href");
  if(href===location.pathname || (FROM_DEMO && href==="/demo.html") || (AID && !FROM_DEMO && href==="/")) a.setAttribute("aria-current","page");
});
if(AID) document.getElementById("disclaimer").textContent = "Candor analysis of a public Reddit thread. Not affiliated with Reddit. Scores are prompts to check sources, not proof.";
if(GALLERY) renderGallery();
else if(DATA) boot(DATA);
else if(AID) poll();
else progressView({status:"error", error:"No analysis selected. Start one from the Analyze tab."});
</script>
