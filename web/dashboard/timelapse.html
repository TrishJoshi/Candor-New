<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narrative Weather</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee; --ink: #0b0b0b; --ink-2: #52514e;
  --muted: #898781; --border: rgba(11,11,11,0.10); --accent: #2a78d6;
  --stage: #0a0f1e; --stage-ink: #e8ecf6; --stage-muted: #8b93ab;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7;
    --muted: #898781; --border: rgba(255,255,255,0.10); --accent: #3987e5; --stage: #05080f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7;
  --muted: #898781; --border: rgba(255,255,255,0.10); --accent: #3987e5; --stage: #05080f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
.wrap { max-width: 1400px; margin: 0 auto; }
header h1 { font-size: 22px; margin: 0 0 2px; font-weight: 650; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--ink-2); max-width: 900px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 14px 0 10px; }
.play { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 16px; cursor: pointer; flex: none; }
.play:focus-visible, select:focus-visible, input:focus-visible, .trend button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.now { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 190px; }
.ctl { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
select { padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; background: var(--stage); border-radius: 12px; overflow: hidden; }
#sky { display: block; width: 100%; height: min(64vh, 620px); min-height: 340px; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: calc(100% - 20px);
  font-size: 11.5px; color: var(--stage-ink); background: rgba(5,8,15,.55); padding: 6px 9px; border-radius: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.stamp { position: absolute; right: 12px; top: 10px; color: var(--stage-muted); font-size: 12px; text-align: right; pointer-events: none; }
.strip { position: relative; margin-top: 8px; height: 58px; }
#activity { width: 100%; height: 58px; display: block; border-radius: 8px; background: var(--surface-2); }
#scrub { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.panel h2 { font-size: 13px; margin: 0; padding: 12px 14px 8px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
.trend { list-style: none; margin: 0; padding: 4px 6px 8px; }
.trend button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 8px; border-radius: 8px; cursor: pointer; }
.trend button:hover { background: var(--surface-2); }
.trend button[aria-pressed="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.trend .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.trend .nm i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.trend .viral { font-size: 10.5px; font-weight: 700; color: #fff; background: #e5484d; border-radius: 8px; padding: 0 6px; margin-left: auto; }
.trend .mt { color: var(--ink-2); font-size: 12px; }
.trend .bar { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
.trend .bar span { display: block; height: 100%; border-radius: 2px; }
.empty { color: var(--muted); padding: 12px 14px; }
.note { color: var(--muted); font-size: 12px; margin: 10px 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Narrative weather</h1>
    <p>Watch the conversation move. Every comment lights up where it sits on the narrative map when it's posted, glowing brighter and bigger the more upvotes it got, then fades. Narratives that go viral swell into bright clouds.</p>
  </header>
  <div class="controls">
    <button class="play" id="play" type="button" aria-label="Pause">❚❚</button>
    <div class="now" id="now" aria-live="off"></div>
    <label class="ctl" title="By activity: every comment gets the same screen time, so busy hours play slowly and quiet weeks pass quickly. Clock: real time.">Time <select id="mode"><option value="activity" selected>By activity</option><option value="clock">Clock</option></select></label>
    <label class="ctl">Speed <select id="speed"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
    <label class="ctl">Trail <select id="trail"><option value="40">Short</option><option value="12" selected>Medium</option><option value="4">Long</option><option value="0">Cumulative</option></select></label>
    <label class="ctl">Colour <select id="colour"><option value="topic">Topic</option><option value="auth">Authenticity</option></select></label>
    <label class="ctl" id="sub-wrap" hidden>Subreddit <select id="sub"></select></label>
  </div>
  <div class="layout">
    <div>
      <div class="stage">
        <canvas id="sky" role="img" aria-label="Animated map of comments appearing over time, grouped by narrative"></canvas>
        <div class="stamp" id="stamp"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="strip">
        <canvas id="activity" aria-hidden="true"></canvas>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Time">
      </div>
      <div class="axis"><span id="t0"></span><span id="t-mid"></span><span id="t1"></span></div>
      <p class="note" id="note"></p>
    </div>
    <aside class="panel" aria-label="Trending narratives">
      <h2 id="trend-h">Trending now</h2>
      <ol class="trend" id="trend"></ol>
    </aside>
  </div>
</div>

 needs."},{"id":3,"label":"Equal enforcement required","topic":65,"center":[1.479,-3.061],"summary":"Commenters argue that workplace dress codes, particularly regarding piercings, must be applied equally to all employees regardless of gender. They suggest that inconsistent enforcement may constitute discrimination and advise checking whether rules are in the dress code and applied neutrally, potentially through HR or legal channels."},{"id":4,"label":"Property rights vs. airspace regulations","topic":53,"center":[-1.238,-1.792],"summary":"Commenters debate whether property owners can restrict low-flying delivery drones over their land, with some arguing that noise, privacy, and physical intrusion justify bans or even shooting drones down, while others counter that federal airspace rules prohibit shooting aircraft and that brief, high-altitude flights do not meaningfully violate property rights."},{"id":5,"label":"Enforce civil discussion","topic":31,"center":[22.451,-3.077],"summary":"The first commenter argues that community rules require courteous, idea-focused discussion and prohibit hate speech or threats, with violations reported and punished by bans. The second commenter argues that a business relationship was a non-political marketing decision made before an election and remains non-political despite optics concerns."},{"id":6,"label":"Enforce civil discussion rules","topic":31,"center":[22.45,-3.076],"summary":"The commenter argues that the subreddit requires civil discussion, urging users to debate ideas rather than attack individuals and to report rule violations such as hate speech or threats of violence to maintain community standards."},{"id":7,"label":"Greatest rock frontmen","topic":56,"center":[1.73,10.563],"summary":"Commenters debate the greatest rock frontmen, frequently naming Freddie Mercury, Robert Plant, and Bon Scott, while others suggest Mick Jagger, David Bowie, and David Lee Roth. One comment highlights Bon Scott's ability to engage a large crowd in Melbourne."},{"id":8,"label":"Regulation solves data center issues","topic":39,"center":[-6.043,3.38],"summary":"Commenters argue that data center problems stem from inadequate oversight rather than the technology itself, and that enforceable rules on energy, cooling, and siting would eliminate downsides. They contend that without regulation, operators will not voluntarily bear the costs of community-friendly design, and some call for moratoriums or baseline standards to address environmental and local-control concerns."},{"id":9,"label":"Avoid unreliable, expensive cars","topic":43,"center":[-0.78,7.148],"summary":"Commenters argue that certain vehicles, particularly from GM, Dodge, and VW, are unreliable and costly to maintain, citing frequent mechanical failures and high repair expenses. They suggest avoiding these brands in favor of more dependable options like Toyota, Honda, or Mazda."},{"id":10,"label":"Medicare for All","topic":71,"center":[-3.461,-1.941],"summary":"Commenters support expanding Medicare access, with some advocating for universal coverage and others highlighting a specific proposal to lower the eligibility age to 50. They argue this would provide more coverage options, reduce costs, and enable older workers to retire, creating job opportunities for younger people."},{"id":11,"label":"One-hit wonder","topic":59,"center":[-4.431,5.043],"summary":"Commenters argue that certain artists are one-hit wonders because they achieved massive success with a single song while failing to replicate that popularity, with some noting that the artist's lack of intent to become a pop star contributed to this status."},{"id":12,"label":"Famous male actors","topic":67,"center":[-4.572,5.75],"summary":"The comments list prominent male actors and debate whether certain performers primarily play themselves or demonstrate range beyond that persona."},{"id":13,"label":"Rockstar prioritizes quality over speed","topic":73,"center":[1.443,3.395],"summary":"Commenters argue that Rockstar prioritizes quality over speed by taking extensive development time to create polished, high-selling games that push industry boundaries. They suggest this approach allows the studio to maintain creative control and financial success without rushing releases."},{"id":14,"label":"China ignores patents","topic":68,"center":[-0.075,2.748],"summary":"Commenters argue that China disregards international patent protections, suggesting reciprocal disregard is justified. They frame this as a response to perceived Chinese indifference toward foreign intellectual property, though some comments diverge into unrelated legal and product-design discussions."},{"id":15,"label":"Rescind offers only after investigation","topic":69,"center":[2.287,-3.11],"summary":"Commenters argue that employers should not rescind job offers based on unverified reports or rumors without first investigating and allowing the candidate to respond. They emphasize due process to avoid legal risks, such as adverse reliance claims, particularly in California."},{"id":16,"label":"Expand the House","topic":7,"center":[-6.713,-2.01],"summary":"Commenters argue that the U.S. House should be significantly expanded to address unequal representation, noting that current district populations vary widely and the 435-seat cap distorts both the House and Electoral College. They suggest that increasing the number of representatives would create more equal district sizes and improve democratic fairness."},{"id":17,"label":"Abolish the electoral college","topic":7,"center":[-6.542,-1.83],"summary":"Commenters argue that the Electoral College is anti-democratic and should be abolished because it creates winner-take-all dynamics, gives rural conservatives outsized representation, and focuses campaigns on a few swing states. They contend that eliminating it would ensure every vote counts equally and prevent the system from being manipulated like gerrymandering."},{"id":18,"label":"Microsoft 364","topic":47,"center":[-7.904,3.081],"summary":"Commenters are discussing a perceived shift from Microsoft 365 to Microsoft 364, with some suggesting the product should be renamed or noting a backward countdown."},{"id":19,"label":"National security outweighs infidelity","topic":74,"center":[-1.154,2.528],"summary":"Commenters argue that the primary concern is national security breaches, such as espionage or foreign compromise, rather than personal infidelity. They suggest that security risks and potential treason overshadow the relevance of marital affairs."},{"id":20,"label":"Hospitals are valid military targets","topic":49,"center":[-2.465,-0.817],"summary":"Commenters argue that hospitals lose protected status and become valid military targets when used by armed groups for military purposes, such as housing command centers or fighters. They contend that this shifts responsibility for attacks onto the groups using the facilities, while critics suggest such justifications are pretexts for striking protected sites."},{"id":21,"label":"Concrete coffee joke","topic":55,"center":[-0.923,3.712],"summary":"Commenters joke about mixing coffee and concrete, with some misunderstanding the research as making coffee stronger while others explain that engineers used coffee-derived charcoal to strengthen concrete by 30%. The discussion blends sarcastic personal anecdotes about consuming cement with confusion over the headline’s wording."},{"id":22,"label":"Agency contractors are W-2 employees","topic":66,"center":[2.901,-3.781],"summary":"Commenters argue that agency contractors are W-2 employees of the staffing agency rather than independent 1099 contractors, and that client companies may be joint employers under doctrines such as the ABC or Ma test. They note that treating these workers like employees—assigning work, providing equipment, and including them in meetings—supports this classification despite the intermediary arrangement."},{"id":23,"label":"Employer hardship concerns","topic":11,"center":[1.052,-4.861],"summary":"Commenters argue that indefinite or frequent extra breaks create an unreasonable hardship for employers by significantly reducing productive work time and disrupting operations. They contend that accommodations must be specific and time-limited under ADA guidelines, suggesting that vague requests may lead employers to deny them or pursue separation instead."},{"id":24,"label":"FMLA certification compliance required","topic":11,"center":[1.299,-4.966],"summary":"Commenters argue that employees must submit complete, valid FMLA medical certifications within required timelines and cannot unilaterally set leave terms, while noting employers may request updated or additional forms if information is insufficient and should allow opportunities to correct errors before denying claims."},{"id":25,"label":"Workplace leave issues","topic":52,"center":[2.072,-5.155],"summary":"The comment titles indicate concerns about workplace leave, including FMLA exhaustion, sick time, staffing agency problems, alleged mishandling and retaliation, contractor status, and post-employment benefits. However, the visible text consists only of automated moderator notices stating that posts are locked and removed pending review, so no actual commenter arguments are available to summarize."},{"id":26,"label":"Severance vs. legal risk","topic":34,"center":[1.785,-4.24],"summary":"Commenters debate whether to accept a severance package or pursue a legal claim, arguing that while potential claims may exist, they are difficult to prove and often require significant time and expense. Consequently, many suggest that severance offers a more practical resolution given the high legal risks and evidentiary burdens involved."},{"id":27,"label":"Wage theft legal recourse","topic":0,"center":[2.818,-4.619],"summary":"Commenters discuss legal avenues for wage theft claims, noting that Minnesota and federal law may permit double or liquidated damages, though good-faith defenses and recent Department of Labor enforcement changes can affect outcomes. They advise documenting evidence and considering whether to contact a state agency or hire an attorney to pursue full penalties and fees."},{"id":28,"label":"Retroactive PTO policy changes","topic":64,"center":[2.39,-4.845],"summary":"Commenters argue that applying new PTO payout or accrual rules to hours earned under prior policies is unfair because those hours functioned as earned wages. They contend that employees should retain the payout terms and accrual rights that existed when the time was earned, rather than having those benefits altered retroactively."},{"id":29,"label":"Abolish procedural filibuster","topic":25,"center":[-5.283,-1.596],"summary":"Commenters argue that the procedural filibuster should be abolished because it enables obstruction and preserves the status quo without requiring meaningful effort. Many suggest retaining or restoring a talking filibuster to ensure any obstruction requires actual physical and political commitment."},{"id":30,"label":"Take time off work","topic":62,"center":[-1.683,3.838],"summary":"Commenters advocate taking time off work, suggesting specific days such as Fridays or January 2nd, to avoid work and enjoy leisure activities."},{"id":31,"label":"No claim for payout","topic":34,"center":[1.858,-3.826],"summary":"Commenters argue that the poster has no claim for a payout because the applicable policy covers resignation rather than termination, or because the poster does not meet eligibility requirements such as sufficient hours or proper notice."},{"id":32,"label":"Meal period payment legality","topic":0,"center":[2.782,-4.324],"summary":"Commenters debate whether California employers may pay for meal periods while fully relieving employees of duties, noting that such payments count as additional compensation affecting the regular rate of pay and overtime calculations. They also explain that employers may instead provide an unpaid, duty-free meal period or pay a one-hour premium for missed breaks, with further penalties possible for inaccurate hour tracking or paystub disclosures."},{"id":33,"label":"Musk lacks foreign policy authority","topic":46,"center":[-0.821,0.951],"summary":"Commenters argue that Musk, as a private citizen and defense contractor, lacks the authority to set foreign policy, which they say belongs to elected officials. They express concern that his control over Starlink and SpaceX gives him undue influence over international conflicts and suggest he should be subject to government oversight or divestment."},{"id":34,"label":"Thoughtful and attentive","topic":45,"center":[-3.144,7.213],"summary":"Commenters argue that genuine attraction stems from attentiveness, emotional maturity, and consistency, valuing partners who listen, remember details, consider their needs, and appreciate their inner qualities rather than merely their usefulness."},{"id":35,"label":"Jensen Huang is irreplaceable","topic":14,"center":[0.638,2.218],"summary":"Commenters argue that Jensen Huang is irreplaceable because his unique leadership and vision are central to Nvidia's identity and success, suggesting the company would struggle to find a comparable CEO or maintain its trajectory without him."},{"id":36,"label":"Nvidia circumvents China sanctions","topic":14,"center":[0.874,2.531],"summary":"Commenters argue that Nvidia is bypassing U.S. sanctions on China by selling or facilitating access to advanced chips, such as H200 and Blackwell GPUs, through approved channels, overseas data centers, or rental arrangements. They suggest these methods allow Chinese firms to obtain restricted hardware despite existing export controls."},{"id":37,"label":"Fax machines persist in Japan","topic":21,"center":[1.747,-0.019],"summary":"Commenters argue that fax machines remain in active use in Japan because organizations continue relying on established infrastructure rather than adopting newer digital tools. They suggest this persistence offers practical benefits, such as communication during internet outages and reduced vulnerability to certain cyberattacks."},{"id":38,"label":"Google AI exclusion rationale","topic":54,"center":[1.054,1.342],"summary":"Commenters argue that Google excludes AI-free schools because its search products are inherently AI-driven and cannot be separated, suggesting that maintaining a distinct non-AI system would be technically and financially impractical. They also frame the move as Google prioritizing its AI ecosystem and ad revenue over parental and institutional resistance to AI in education."},{"id":39,"label":"Mamdani effectively engages Trump","topic":42,"center":[-4.19,-1.521],"summary":"Commenters argue that Mamdani effectively engages Trump by manipulating or influencing him, citing his ability to make deals and shape Trump's behavior as a model for other Democrats."},{"id":40,"label":"Surveillance pricing is exploitative","topic":33,"center":[-0.766,1.685],"summary":"Commenters argue that surveillance pricing is exploitative because it uses personal data to charge individuals different prices, often without consent, and they contrast this with unfair comparisons to standard discounts. They also cite regulatory actions and privacy violations as evidence that data-driven pricing and corporate data practices require stricter oversight."},{"id":41,"label":"Corporate greed harms society","topic":3,"center":[-1.278,1.473],"summary":"Commenters argue that corporations prioritize shareholder value and profit over human welfare, often exploiting workers and avoiding accountability. They contend that this focus on financial growth and stock buybacks harms society and that large corporations should be broken up or regulated."},{"id":42,"label":"Raise minimum wage","topic":3,"center":[-1.664,1.115],"summary":"Commenters argue that the current federal minimum wage is insufficient for a basic standard of living and should be increased to allow workers to afford housing and necessities. They cite stagnant wage growth over decades and political momentum as reasons for the change."},{"id":43,"label":"Force vetoes to damage Trump","topic":4,"center":[-4.369,-0.763],"summary":"Commenters argue that Democrats should pass popular, standalone legislation to compel President Trump to either sign reforms benefiting Americans or veto them and appear obstructive. They contend this strategy creates a political win-win by securing policy gains or damaging Trump’s public image and Republican support."},{"id":44,"label":"Manipulate Trump for positive results","topic":4,"center":[-4.08,-0.686],"summary":"Commenters argue that Trump can be influenced to support beneficial legislation by appealing to his ego and desire for personal credit, suggesting that strategic flattery and managing his advisors can produce positive policy outcomes despite his lack of ideological conviction."},{"id":45,"label":"AI replacing engineers","topic":17,"center":[0.317,0.695],"summary":"Commenters argue that AI is replacing human engineers through layoffs and increased reliance on automated code, suggesting this shift creates unmanageable systems and technical risks that remaining staff cannot resolve."},{"id":46,"label":"Anti-AI sentiment","topic":17,"center":[0.139,1.288],"summary":"Commenters express skepticism and opposition toward AI, arguing that it is overhyped, causes errors, and requires stricter oversight or removal."},{"id":47,"label":"Incompetent infrastructure management","topic":13,"center":[0.428,0.092],"summary":"Commenters argue that the prolonged outage reveals incompetent infrastructure management, citing a lack of redundancy, unclear status updates, and insufficient disaster recovery planning. They suggest that major providers fail to maintain adequate backups, creating dangerous dependencies and slow recovery times."},{"id":48,"label":"Greatest films ever","topic":12,"center":[-4.105,6.222],"summary":"Commenters identify eight diverse films as the greatest ever, spanning crime dramas, historical epics, and emotional stories. They argue these works excel through compelling narratives, strong performances, and lasting emotional impact."},{"id":49,"label":"Dredd is best","topic":12,"center":[-4.517,6.477],"summary":"Commenters argue that Dredd is the best film, citing its 2012 release and suggesting it deserves a sequel."},{"id":50,"label":"Snow is a baseline experience","topic":22,"center":[-3.6,5.354],"summary":"Commenters argue that snow is a baseline experience for those born or raised in snowy regions, contrasting with others who first encountered it later in life. They discuss these initial experiences neutrally, noting personal and cultural associations with snow."},{"id":51,"label":"Microsoft's cloud reliability failure","topic":13,"center":[0.854,0.032],"summary":"Commenters argue that Microsoft's prolonged cloud outage exposes the risks of centralized infrastructure, noting that businesses and institutions have offloaded critical systems to a single provider. They criticize the resulting disruption, question Microsoft's reliability, and suggest that over-reliance on a few large vendors creates dangerous single points of failure."},{"id":52,"label":"Microsoft 365 global outage","topic":13,"center":[0.949,-0.246],"summary":"Commenters report a widespread Microsoft 365 outage affecting services like Outlook, Teams, and Copilot, noting that restoration efforts faced difficulties. Some speculate that the true impact will only be evident when full business loads resume on Monday, while others jokingly compare the disruption to a fictional AI takeover."},{"id":53,"label":"Phone etiquette violations","topic":40,"center":[-1.343,4.243],"summary":"Commenters argue that various phone and public behaviors violate etiquette, including phone use during in-person interactions, speakerphone calls in stores, and social media dances blocking foot traffic. They also criticize calling out quiet individuals in groups, stating these actions disrupt shared spaces and create social discomfort."},{"id":54,"label":"Internet was once limited","topic":50,"center":[-0.597,4.302],"summary":"Commenters argue that internet access was once restricted by technology and household constraints, such as dial-up occupying landlines and the absence of mobile devices. They contrast this limited past with the present, where the internet is considered essential for communication, work, and daily life."},{"id":55,"label":"ICE agents are red flags","topic":48,"center":[-2.424,0.863],"summary":"Commenters argue that joining ICE is a significant warning sign, suggesting that agents are more likely to have criminal records or sociopathic tendencies than those they target. They further claim that individuals willing to work for the agency likely possess a history of problematic behavior."},{"id":56,"label":"Class supremacist","topic":23,"center":[-3.089,0.544],"summary":"The commenters argue that Stephen Miller embodies class supremacism, believing that wealth and social status indicate inherent superiority and that those in lower economic positions are inferior or lazy. They suggest he seeks to maintain a rigid social hierarchy where specific groups remain in subservient roles to serve the elite."},{"id":57,"label":"Texas is unexpectedly progressive","topic":60,"center":[-4.688,1.684],"summary":"Commenters argue that Texas is becoming unexpectedly progressive, citing the election of a Hispanic woman as governor and references to past progressive figures like Ann Richards as evidence of a shift toward compassion and inclusivity."},{"id":58,"label":"Consenting adults' privacy rights","topic":37,"center":[-4.484,1.981],"summary":"Commenters argue that consensual adult sexual activity is a private matter beyond government authority, supporting repeals of anti-sodomy laws to prevent selective enforcement and protect personal autonomy."},{"id":59,"label":"Government orchestrated cyberattack scam","topic":57,"center":[-1.139,0.271],"summary":"Commenters argue that the incident was a government-orchestrated cyberattack or extortion scheme designed to justify a large funding request, suggesting officials are downplaying it as a technical failure to avoid panic."},{"id":60,"label":"She will cross 50%","topic":6,"center":[-5.287,1.576],"summary":"Commenters argue that the candidate will surpass 50% because she is only about 600 votes short and remaining ballots come from favorable areas. They cite various media outlets, including Votehub, CNN, and the AP, as evidence that the race has been or will soon be called in her favor."},{"id":61,"label":"NATO membership is unacceptable","topic":38,"center":[-3.048,-0.567],"summary":"Commenters argue that NATO membership for Ukraine is unacceptable because Russia will reject it, viewing it as a security threat, and that any deal requiring territorial concessions would be ineffective and likely invite further aggression."},{"id":62,"label":"Peltola likely to win","topic":70,"center":[-5.839,1.715],"summary":"Commenters argue that Peltola is likely to win because she is close to a majority and Sullivan would need nearly all second-choice votes from eliminated candidates to overtake her. They also suggest that exhausted ballots and vote splitting among Republican candidates could push Peltola over the 50% threshold."},{"id":63,"label":"Democrats win Alaska","topic":6,"center":[-5.675,1.41],"summary":"Commenters argue that Democrats achieved significant victories in Alaska, including the governorship and potentially a Senate seat, marking a notable political shift. They view these wins as a positive change and part of a broader Democratic wave extending to traditionally conservative regions."},{"id":64,"label":"Traumatic witnessing experiences","topic":19,"center":[-2.944,6.265],"summary":"Commenters describe witnessing sudden, violent accidents and disasters, including animal and pedestrian fatalities, the 9/11 attacks, and a catastrophic flood. They argue these traumatic events caused lasting shock and haunting memories due to their graphic nature and the victims' helplessness."},{"id":65,"label":"Prosecution deters crime","topic":32,"center":[-2.561,1.729],"summary":"Commenters argue that prosecuting and punishing crimes is necessary to prevent their recurrence, while noting that ignorance of the law does not excuse violations. They also discuss potential legal actions, including standing issues and the availability of pro-bono legal support."},{"id":66,"label":"Low-quality journalism","topic":18,"center":[-2.444,2.427],"summary":"Commenters argue that the article exemplifies low-quality journalism, criticizing its reliance on vague sources, lack of substantive detail, predictable framing, and failure to issue corrections or follow-up verification."},{"id":67,"label":"Lots of money","topic":5,"center":[-1.027,4.953],"summary":"Commenters associate the viewpoint with having substantial wealth, emphasizing financial security, freedom from daily monetary concerns, and the ability to provide for family needs such as housing."},{"id":68,"label":"Digital spending feels unreal","topic":24,"center":[-0.369,4.943],"summary":"Commenters argue that digital and contactless payments make spending feel abstract and disconnected from real money, often only becoming tangible when bank statements arrive or financial consequences occur."},{"id":69,"label":"Finding purpose through change","topic":10,"center":[-2.126,7.239],"summary":"Commenters argue that finding purpose and recovering from depression often requires significant lifestyle changes, such as leaving stressful jobs, adopting pets, exercising, or engaging in hobbies. They suggest that shifting focus toward new responsibilities or distractions can provide the motivation and mental relief needed to improve well-being."},{"id":70,"label":"NWS is operational","topic":41,"center":[-0.467,-0.826],"summary":"Commenters argue that the National Weather Service is operational, citing official statements and public radar data. They suggest reports of outages stem from outdated web pages and poor journalism rather than current system failures."},{"id":71,"label":"Search for survivors","topic":61,"center":[-1.706,6.388],"summary":"Commenters argue that if they were the last person on Earth, they would actively search for other survivors rather than assume total isolation, driven by the need for human connection and the practical impossibility of surviving alone."},{"id":72,"label":"Intentional crisis for funding","topic":8,"center":[-1.376,-0.29],"summary":"Commenters argue that the FAA outage was deliberately engineered or exploited by the Trump administration to create urgency and secure additional federal funding, citing the timing of funding requests and the rapid lifting of the ground stop as evidence of a manufactured crisis."},{"id":73,"label":"New AI caused outage","topic":8,"center":[-0.823,-0.415],"summary":"Commenters argue that the nationwide FAA ground stop was likely caused by the newly deployed SMART AI system, noting its recent rollout to air traffic control centers and the rarity of such outages. They suggest a connection between the AI implementation and the network crash, while some also reference historical precedents or unrelated speculation to underscore concerns about systemic failure."},{"id":74,"label":"$50B shakedown scam","topic":2,"center":[-2.071,0.253],"summary":"Commenters argue that a $50 billion funding request is a politically motivated shakedown or scam, asserting that the request lacks transparency, a clear plan, or proof that the money would address the underlying failure. They criticize the administration's competence and suggest the crisis may be manufactured to extort funds from a sympathetic Congress."},{"id":75,"label":"She is widely despised","topic":2,"center":[-4.106,1.326],"summary":"Commenters argue that she is a contemptible and ineffective politician who deserves political defeat and historical obscurity. They cite her conduct, alleged cowardice, and association with opposing factions as reasons for their strong disdain."},{"id":76,"label":"Trump admires authoritarian leaders","topic":2,"center":[-3.264,0.292],"summary":"Commenters argue that Trump admires authoritarian leaders because he seeks to emulate their dictatorial control and dismantle democratic norms in the U.S. They support this by alleging he is a foreign asset and has purged his party to secure absolute loyalty."},{"id":77,"label":"Administration is corrupt and criminal","topic":2,"center":[-2.796,0.808],"summary":"The commenters argue that the administration is corrupt and criminal, claiming officials are stealing taxpayer money, engaging in grift, and creating manufactured chaos. They assert that these actions amount to treason and that the entire executive branch should be imprisoned."},{"id":78,"label":"Oppose Vance presidential run","topic":2,"center":[-4.54,0.347],"summary":"Commenters oppose a Vance presidential run primarily due to concerns about his age and suitability for leadership, suggesting he is better suited as majority leader. Others argue his path to the presidency is unlikely unless Trump dies or is removed, with some speculating about political maneuvering or a coup to install him."},{"id":79,"label":"Foreign policy prioritization","topic":2,"center":[-3.575,1.351],"summary":"Commenters argue that domestic economic concerns should take precedence over foreign policy, claiming that international commitments have diverted resources and attention from local needs. They also express frustration with current political leadership, suggesting that established figures are failing to address these priorities and should be replaced."},{"id":80,"label":"Contact your senators","topic":58,"center":[-5.296,0.593],"summary":"Commenters encourage constituents to contact their senators to express their views and ensure representatives are aware of constituent priorities. They frame persistent communication as necessary for effective representation and share personal intentions to call their senators' offices."},{"id":81,"label":"Fear of falling objects","topic":26,"center":[-1.296,6.547],"summary":"Commenters describe irrational fears centered on objects or structures falling and causing injury, such as traffic lights, toilet seats, or highway cargo. Some link these anxieties to real accidents, media depictions, or a general sense of vulnerability in everyday environments."},{"id":82,"label":"MAGA is delusional","topic":2,"center":[-3.781,0.699],"summary":"Commenters argue that MAGA adherents are irrational and detached from reality, blaming their leader and citing a lack of self-awareness, fiscal irresponsibility, and the influence of brain trauma as evidence of their delusion."},{"id":83,"label":"Wait for strategic timing","topic":29,"center":[-4.316,-0.4],"summary":"Commenters argue that immediate impeachment is strategically premature and politically counterproductive, as it risks appearing vengeful and would likely be blocked by the Republican Senate or lead to an unfavorable replacement. They suggest waiting for a Democratic Senate majority and first building public support through lower-level investigations to ensure a more successful conviction and stronger political position."},{"id":84,"label":"Republican procedural control","topic":2,"center":[-4.033,0.122],"summary":"Commenters argue that procedural outcomes were driven by Republican control of the current Congress, noting that Republicans set the voting agenda, introduced the measure, and scheduled it while the opposing party lacked sufficient presence or power to influence the result. They suggest media coverage misleadingly attributes responsibility to Democrats or incoming leadership despite this procedural reality."},{"id":85,"label":"Van Hollen leadership bid","topic":27,"center":[-5.965,0.119],"summary":"Commenters discuss Chris Van Hollen's bid for Senate leadership, noting his support from progressive senators and his decision to rule out a 2028 presidential run. Some critics question his leadership record, citing past Democratic losses during his tenure as committee chair."},{"id":86,"label":"AIPAC money corrupts Democrats","topic":72,"center":[-5.663,-0.742],"summary":"Commenters argue that AIPAC financial contributions compromise Democratic politicians, prioritizing Israeli interests over those of the United States and their constituents. They claim this influence prevents policy changes and call for removing AIPAC-backed members and PAC money from politics."},{"id":87,"label":"Reddit is time-wasting","topic":15,"center":[-1.605,5.249],"summary":"Commenters argue that Reddit is a time-wasting activity, often involving hours of scrolling or doomscrolling that leaves users wondering where their day went. Some note they use it while multitasking or waiting in real life."},{"id":88,"label":"Good morning vibes","topic":15,"center":[-2.096,5.165],"summary":"The commenters share their early-morning states, ranging from positive energy and productivity to stress and fatigue, while generally expressing a desire to improve their day or connect with others."},{"id":89,"label":"Hangover remedies and cures","topic":20,"center":[-0.518,6.256],"summary":"Commenters suggest various hangover remedies, including hydration, pain relievers, caffeine, greasy breakfasts, and specific foods like pho or chocolate milk. Some also recommend preventative measures such as eating before drinking or consuming alcohol to sleep through the symptoms."},{"id":90,"label":"Jeffries needs a challenger","topic":1,"center":[-5.296,-0.52],"summary":"Commenters argue that Jeffries is an inadequate leader who is too incremental and tied to the status quo to effectively counter Trump, and they call for a courageous challenger to emerge and provide a more urgent alternative."},{"id":91,"label":"Schumer needs to step down","topic":1,"center":[-5.527,-0.111],"summary":"Commenters argue that Chuck Schumer should step down due to perceived poor leadership, lack of representation for constituents, and associations with controversial figures, suggesting he is no longer effective or aligned with the party's interests."},{"id":92,"label":"Schumer must step down","topic":1,"center":[-5.468,-0.203],"summary":"Commenters argue that Schumer should step down to allow new Democratic leadership after the election, citing his long tenure, perceived resistance to change, and responsibility for recent setbacks. They suggest replacing him with figures like Jeffries or Van Hollen to restore confidence and respond to voter demand for change."},{"id":93,"label":"Family and pets","topic":36,"center":[-2.979,5.521],"summary":"Commenters identify family members and pets as their primary sources of affection and priority, arguing that these relationships constitute what they value most. They emphasize emotional bonds with loved ones and animals, framing them as central to their lives."},{"id":94,"label":"Embrace life's possibilities","topic":5,"center":[-2.548,5.591],"summary":"Commenters argue for embracing life's possibilities by highlighting themes of wisdom, hope, peace, and the beauty of existence, including the joy of new family milestones."},{"id":95,"label":"Chronic over-apologizing behavior","topic":30,"center":[-1.652,6.917],"summary":"Commenters argue that chronic over-apologizing often stems from a habit of accepting undue blame, frequently linked to difficult upbringings or narcissistic relationships, and is accompanied by excessive independence and a reluctance to seek help due to a lack of trust in others."},{"id":96,"label":"Health concerns and substances","topic":16,"center":[-1.216,5.964],"summary":"Commenters discuss various health concerns and substances, including alcohol, Xanax, blood cell counts, iron levels, shingles, a meniscus injury, marathon training, and nail biting, suggesting a focus on how different substances and behaviors impact physical well-being."},{"id":97,"label":"Strong negative frustration","topic":5,"center":[-2.409,2.875],"summary":"The commenters express intense frustration and anger toward a situation, individual, or product, using profanity to convey disbelief and annoyance. One comment specifically criticizes the pricing of luggage as unreasonable."},{"id":98,"label":"Food preferences","topic":16,"center":[-0.694,5.747],"summary":"The commenters list various food items and household conveniences, suggesting that these represent their personal preferences or essential needs. They argue that access to specific foods and basic sanitation infrastructure is important to them."},{"id":99,"label":"Easy gourmet home cooking","topic":9,"center":[0.183,6.004],"summary":"Commenters argue that gourmet-style meals can be easily prepared at home using simple techniques, pantry staples, and convenience items like jarred sauces or pre-made biscuits. They emphasize that patience and basic seasoning can make home cooking taste professional without requiring advanced culinary skills."},{"id":100,"label":"Grief and loss","topic":35,"center":[-2.738,6.298],"summary":"Commenters describe grief and loss as responses to death, breakups, and caregiving stress, noting that while pain may persist, people learn to cope or develop temporary habits to manage emotional weight."},{"id":101,"label":"Cut toxic ties","topic":28,"center":[-2.618,6.896],"summary":"Commenters argue that ending or distancing from one-sided, selfish friendships is justified, often by matching others' energy or withdrawing effort without confrontation. They frame this as a necessary response to relationships where support is not reciprocated."},{"id":102,"label":"Skepticism towards claims","topic":5,"center":[-3.105,3.069],"summary":"Commenters express doubt about the authenticity of claims made by certain individuals, citing perceived inconsistencies in behavior, speech, or background. They suggest that the presented narratives may be exaggerated or fabricated based on personal observation and prior context."},{"id":103,"label":"Positive reaction","topic":5,"center":[-3.2,4.393],"summary":"Commenters express approval and enthusiasm, using short exclamations and affirmations to indicate a positive reaction. Some also acknowledge that the task or situation is challenging."},{"id":104,"label":"Skeptical inquiry","topic":5,"center":[-2.18,3.946],"summary":"Commenters challenge claims by demanding precise definitions, evidence, and direct answers, questioning whether speakers possess relevant expertise or are avoiding specific questions."},{"id":105,"label":"Attraction confirmed","topic":5,"center":[-2.872,4.626],"summary":"Commenters express attraction through emojis, direct compliments, and references to characters, indicating a shared interest in the subject."},{"id":106,"label":"Shared amusement","topic":5,"center":[-2.71,4.037],"summary":"The commenters express shared amusement through brief laughter and agreement, reacting to a humorous situation. One comment adds a joke about a low bar, while another references a name in a lighthearted manner."}],"topics":[{"id":5,"label":"Relationships","size":241},{"id":2,"label":"Trump Administration","size":204},{"id":34,"label":"Severance pay","size":84},{"id":17,"label":"AI Impact","size":70},{"id":15,"label":"Social Media","size":64},{"id":8,"label":"AI Outage","size":60},{"id":14,"label":"Nvidia Leadership","size":60},{"id":12,"label":"Film rankings","size":58},{"id":59,"label":"Music Success","size":49},{"id":31,"label":"Discussion rules","size":47},{"id":39,"label":"Data center regulation","size":47},{"id":1,"label":"Leadership Change","size":45},{"id":13,"label":"Cloud outage","size":43},{"id":6,"label":"Election outcomes","size":42},{"id":64,"label":"PTO Policy Changes","size":42},{"id":28,"label":"Relationship boundaries","size":40},{"id":74,"label":"Marital fidelity","size":39},{"id":3,"label":"Economic Inequality","size":38},{"id":7,"label":"Electoral Reform","size":38},{"id":0,"label":"Wage Theft","size":36},{"id":16,"label":"Dietary choices","size":36},{"id":56,"label":"Rock frontmen","size":33},{"id":71,"label":"Healthcare reform","size":33},{"id":10,"label":"Purposeful Change","size":32},{"id":25,"label":"Senate Filibuster","size":30},{"id":11,"label":"FMLA Compliance","size":29},{"id":72,"label":"AIPAC influence","size":29},{"id":30,"label":"Apology Psychology","size":27},{"id":49,"label":"Hospital targeting","size":27},{"id":33,"label":"Surveillance Pricing","size":26},{"id":43,"label":"Car purchasing","size":26},{"id":53,"label":"Airspace Rights","size":26},{"id":66,"label":"Employment Classification","size":26},{"id":4,"label":"Trump Strategy","size":25},{"id":18,"label":"Journalism quality","size":25},{"id":37,"label":"Adult privacy","size":25},{"id":50,"label":"Internet History","size":25},{"id":38,"label":"NATO Membership","size":24},{"id":52,"label":"Employee Leave","size":24},{"id":58,"label":"Civic Engagement","size":24},{"id":73,"label":"Game Development","size":24},{"id":27,"label":"Senate Leadership","size":23},{"id":35,"label":"Grief and loss","size":23},{"id":63,"label":"Theoretical validity","size":23},{"id":46,"label":"Elon Musk","size":22},{"id":60,"label":"Texas politics","size":22},{"id":9,"label":"Home Cooking","size":21},{"id":21,"label":"Fax machines","size":21},{"id":48,"label":"Immigration enforcement","size":21},{"id":51,"label":"Vaccine Hesitancy","size":20},{"id":42,"label":"Trump engagement","size":19},{"id":54,"label":"AI Exclusion","size":18},{"id":55,"label":"Coffee humor","size":18},{"id":65,"label":"Law Enforcement","size":17},{"id":20,"label":"Hangover cures","size":16},{"id":44,"label":"AI Surveillance","size":16},{"id":61,"label":"Search and Rescue","size":16},{"id":19,"label":"Traumatic witnessing","size":15},{"id":45,"label":"Communication","size":15},{"id":67,"label":"Male actors","size":15},{"id":68,"label":"Intellectual Property","size":15},{"id":23,"label":"Class hierarchy","size":14},{"id":36,"label":"Family and pets","size":14},{"id":69,"label":"Offer Rescission","size":14},{"id":22,"label":"Snow experience","size":13},{"id":29,"label":"Timing Strategy","size":13},{"id":32,"label":"Crime Deterrence","size":13},{"id":40,"label":"Phone Etiquette","size":13},{"id":41,"label":"NWS Operations","size":13},{"id":57,"label":"Cybersecurity Threats","size":13},{"id":62,"label":"Work-Life Balance","size":13},{"id":24,"label":"Digital Spending","size":12},{"id":26,"label":"Phobia","size":12},{"id":47,"label":"Microsoft 365","size":12},{"id":70,"label":"Election outcome","size":12}]}</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("tl-data").textContent);
  const P = D.points, N = P.x.length;
  const HAS_UP = Array.isArray(P.upvotes), HAS_AUTH = Array.isArray(P.band);
  const narr = new Map(D.narratives.map(n => [n.id, n]));
  const topic = new Map(D.topics.map(t => [t.id, t]));
  const $ = id => document.getElementById(id);
  const fmt = new Intl.NumberFormat(), compact = new Intl.NumberFormat(undefined, {notation: "compact"});
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const PALETTE = ["#4f9cf9", "#ff8a4c", "#3ddc97", "#c77dff", "#ffd166", "#ff5d8f", "#4dd4e8", "#a3d65c",
                   "#7c8cff", "#ffb36b", "#5be0c4", "#e58bff"];
  const LEGEND_TOPICS = 8;
  const OTHER = "#7d8597";
  const BAND = {ok: ["#3ddc97", "likely authentic"], warn: ["#ffd166", "uncertain"], bad: ["#ff4d5e", "suspicious"], na: ["#7d8597", "not scored"]};
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ------------------------------------------------------------------ state
  // Playback runs on a progress axis u in [0, 1]. "activity": u = a comment's rank in time, so every
  // comment gets the same screen time; "clock": u is linear in real time. Trails decay in u.
  let mode = "activity", sub = "", colourBy = "topic", trailDiv = 12, speed = 1, playing = !reduced, focus = null;
  let idx = [], ts = [], lo = 0, hi = 1, uNow = 0, before = 0, topicColour = new Map();
  const upR = new Float32Array(N), U = new Float64Array(N);
  const LOOP_S = 45;  // seconds for one pass at 1x

  // sprites: a soft radial glow per colour, drawn scaled with additive blending
  const sprites = new Map();
  function sprite(colour) {
    if (sprites.has(colour)) return sprites.get(colour);
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,0.55)"); gr.addColorStop(0.12, colour);
    gr.addColorStop(0.55, colour + "55"); gr.addColorStop(1, colour + "00");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    sprites.set(colour, c); return c;
  }

  // ------------------------------------------------------------ data window
  const subs = new Map();
  P.subreddit.forEach(s => { if (s) subs.set(s, (subs.get(s) || 0) + 1); });
  if (subs.size > 1) {
    $("sub-wrap").hidden = false;
    $("sub").innerHTML = `<option value="">All (${fmt.format(N)})</option>` +
      [...subs].sort((a, b) => b[1] - a[1]).map(([s, c]) => `<option value="${esc(s)}">r/${esc(s)} (${fmt.format(c)})</option>`).join("");
  }
  function prepare() {
    const all = [];
    for (let i = 0; i < N; i++) if (P.t[i] != null && P.narrative[i] !== -1 && (!sub || P.subreddit[i] === sub)) all.push(i);
    all.sort((a, b) => P.t[a] - P.t[b]);
    if (mode === "clock") {
      // the shortest window holding 95% of the comments: a few much older ones would stretch the loop
      const s = all.map(i => P.t[i]), k = Math.max(1, Math.ceil(0.95 * s.length) - 1);
      let best = 0;
      for (let j = 1; j + k < s.length; j++) if (s[j + k] - s[j] < s[best + k] - s[best]) best = j;
      lo = s[best] ?? 0; hi = s[Math.min(best + k, s.length - 1)] ?? 1;
      if (hi - lo < 3600) { lo -= 1800; hi += 1800; }
      const pad = (hi - lo) * 0.02; lo -= pad; hi += pad;
      idx = all.filter(i => P.t[i] >= lo && P.t[i] <= hi);
      for (const i of idx) U[i] = (P.t[i] - lo) / (hi - lo);
    } else {
      idx = all;
      idx.forEach((i, r) => { U[i] = idx.length > 1 ? r / (idx.length - 1) : 0; });
      lo = idx.length ? P.t[idx[0]] : 0; hi = idx.length ? P.t[idx[idx.length - 1]] : 1;
    }
    ts = idx.map(i => P.t[i]);
    before = all.length - idx.length;
    // size by upvotes (square root, capped at the 98th percentile)
    const ups = idx.map(i => HAS_UP ? (P.upvotes[i] || 0) : 0).sort((a, b) => a - b);
    const cap = Math.max(1, ups[Math.floor(0.98 * (ups.length - 1))] || 1);
    for (const i of idx) upR[i] = Math.sqrt(Math.min(HAS_UP ? (P.upvotes[i] || 0) : 0, cap) / cap);
    // topic colours, cycling through the palette by upvotes here; the legend names the top 8
    const tu = new Map();
    for (const i of idx) tu.set(P.topic[i], (tu.get(P.topic[i]) || 0) + (HAS_UP ? (P.upvotes[i] || 0) : 0) + 1);
    topicColour = new Map([...tu].sort((a, b) => b[1] - a[1]).map(([t], j) => [t, PALETTE[j % PALETTE.length]]));
    fitView(); drawActivity(); legend();
    uNow = 0; focus = null;
    $("t0").textContent = when(tAt(0), true); $("t1").textContent = when(tAt(1), true); $("t-mid").textContent = when(tAt(0.5), true);
    $("note").textContent = (mode === "activity"
        ? "Playback follows the conversation: every comment gets the same screen time, so busy hours play slowly and quiet stretches pass quickly (the clock shows real time). "
        : (before ? `${fmt.format(before)} comment(s) outside ${when(lo, true)} – ${when(hi, true)} are left out of the loop. ` : "")) +
      "Upvotes are the final counts Reddit showed when we scraped; each comment's upvotes are credited when it was posted." +
      (HAS_AUTH ? "" : " Authenticity colouring needs author scores.");
  }
  const colourOf = i => colourBy === "auth" && HAS_AUTH ? BAND[P.band[i] || "na"][0] : (topicColour.get(P.topic[i]) || OTHER);
  const trailU = () => trailDiv ? 1 / trailDiv : Infinity;  // trail length on the progress axis
  function tAt(u) {  // real time at progress u
    if (mode === "clock" || ts.length < 2) return lo + u * (hi - lo);
    const x = Math.max(0, Math.min(1, u)) * (ts.length - 1), j = Math.floor(x);
    return j >= ts.length - 1 ? ts[ts.length - 1] : ts[j] + (x - j) * (ts[j + 1] - ts[j]);
  }
  function when(t, short) {
    const d = new Date(t * 1000);
    return short ? d.toLocaleDateString(undefined, {day: "numeric", month: "short"})
      : d.toLocaleString(undefined, {weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"});
  }
  function human(s) {
    if (!isFinite(s)) return "all so far";
    return s < 3600 ? Math.round(s / 60) + " min" : s < 2 * 86400 ? (s / 3600).toFixed(s < 36000 ? 1 : 0) + " h" : Math.round(s / 86400) + " days";
  }

  // ------------------------------------------------------------------- view
  const sky = $("sky"), ctx = sky.getContext("2d");
  let W = 0, H = 0, dpr = 1, sx = v => v, sy = v => v, ghost = null;
  function fenced(arr) {
    const s = [...arr].sort((a, b) => a - b), q = f => s[Math.floor(f * (s.length - 1))];
    const q1 = q(0.25), q3 = q(0.75), iqr = (q3 - q1) || 1;
    return [Math.max(s[0], q1 - 1.5 * iqr), Math.min(s[s.length - 1], q3 + 1.5 * iqr)];
  }
  function fitView() {
    dpr = devicePixelRatio || 1; W = sky.clientWidth; H = sky.clientHeight;
    sky.width = Math.round(W * dpr); sky.height = Math.round(H * dpr);
    if (!idx.length) return;
    const [x0, x1] = fenced(idx.map(i => P.x[i])), [y0, y1] = fenced(idx.map(i => P.y[i])), m = 36;
    sx = v => m + (v - x0) / ((x1 - x0) || 1) * (W - 2 * m);
    sy = v => H - m - (v - y0) / ((y1 - y0) || 1) * (H - 2 * m);
    // faint "terrain": every comment of the loop, so the geography stays readable
    ghost = document.createElement("canvas"); ghost.width = sky.width; ghost.height = sky.height;
    const g = ghost.getContext("2d"); g.scale(dpr, dpr); g.fillStyle = "rgba(160,175,210,0.13)";
    for (const i of idx) { g.beginPath(); g.arc(sx(P.x[i]), sy(P.y[i]), 1.3, 0, 6.283); g.fill(); }
  }

  function weightOf(age) { const tr = trailU(); return isFinite(tr) ? Math.exp(-age / tr) : 1; }
  function frame() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--stage").trim() || "#0a0f1e";
    ctx.fillRect(0, 0, W, H);
    if (ghost) ctx.drawImage(ghost, 0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    const R0 = Math.max(6, Math.min(W, H) / 46), fresh = 1 / 120, score = new Map();
    for (const i of idx) {
      if (U[i] > uNow) break;  // idx is sorted by time
      const age = uNow - U[i], w = weightOf(age);
      if (w < 0.03) continue;
      const pop = age < fresh ? 1 + 0.8 * (1 - age / fresh) : 1;  // new comments pop in
      const r = R0 * (0.45 + 2.6 * upR[i]) * pop;
      const dim = focus !== null && P.narrative[i] !== focus ? 0.12 : 1;
      ctx.globalAlpha = Math.min(1, 0.75 * w * dim);
      ctx.drawImage(sprite(colourOf(i)), sx(P.x[i]) - r, sy(P.y[i]) - r, 2 * r, 2 * r);
      const up = HAS_UP ? (P.upvotes[i] || 0) : 0;
      score.set(P.narrative[i], (score.get(P.narrative[i]) || 0) + w * (up + 1));
    }
    // labels for the brightest narratives right now
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    const top = [...score].sort((a, b) => b[1] - a[1]).slice(0, focus === null ? 5 : 0);
    if (focus !== null && score.has(focus)) top.push([focus, score.get(focus)]);
    const maxS = top.length ? top[0][1] : 1, boxes = [];
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const legendTop = H - ($("legend").offsetHeight || 0) - 14;
    for (const [id, s] of top) {
      const n = narr.get(id); if (!n || !n.center) continue;
      const size = 11 + 6 * Math.sqrt(s / maxS);
      ctx.font = `600 ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
      const w = ctx.measureText(n.label).width, x = Math.max(w / 2 + 6, Math.min(W - w / 2 - 6, sx(n.center[0])));
      let y = Math.min(sy(n.center[1]), legendTop - size / 2);
      // nudge down/up until it doesn't overlap a brighter narrative's label; skip if it can't fit
      let ok = false;
      for (const dy of [0, size + 4, -(size + 4), 2 * (size + 4), -2 * (size + 4)]) {
        const b = {x0: x - w / 2 - 4, x1: x + w / 2 + 4, y0: y + dy - size / 2 - 2, y1: y + dy + size / 2 + 2};
        if (b.y0 < 4 || b.y1 > legendTop) continue;
        if (!boxes.some(o => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0)) { boxes.push(b); y += dy; ok = true; break; }
      }
      if (!ok) continue;
      ctx.shadowColor = "rgba(0,0,0,.85)"; ctx.shadowBlur = 6; ctx.fillStyle = "#f4f6fb";
      ctx.fillText(n.label, x, y);
    }
    ctx.shadowBlur = 0;
    $("now").textContent = when(tAt(uNow));
    $("stamp").textContent = isFinite(trailU()) ? `trail: last ${human(tAt(uNow) - tAt(Math.max(0, uNow - trailU())))}` +
      (mode === "activity" ? ` · ${fmt.format(Math.round(trailU() * idx.length))} comments` : "") : "trail: all so far";
    $("scrub").value = String(Math.round(1000 * uNow));
    drawCursor();
  }

  // --------------------------------------------------------- activity strip
  const act = $("activity"), actx = act.getContext("2d");
  let bins = [], actImg = null;
  function drawActivity() {
    const w = act.clientWidth, h = act.clientHeight, d = devicePixelRatio || 1;
    act.width = Math.round(w * d); act.height = Math.round(h * d);
    const nb = Math.max(40, Math.min(160, Math.round(w / 6)));
    bins = new Array(nb).fill(0);
    for (const i of idx) bins[Math.min(nb - 1, Math.floor(U[i] * nb))] += (HAS_UP ? (P.upvotes[i] || 0) : 0) + 1;
    const max = Math.max(1, ...bins);
    actx.setTransform(d, 0, 0, d, 0, 0); actx.clearRect(0, 0, w, h);
    actx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
    bins.forEach((b, k) => { const bh = (h - 6) * Math.sqrt(b / max); actx.fillRect(k * w / nb + 0.5, h - bh, w / nb - 1, bh); });
    actImg = actx.getImageData(0, 0, act.width, act.height);
  }
  function drawCursor() {
    if (!actImg) return;
    const w = act.clientWidth, h = act.clientHeight, d = devicePixelRatio || 1, x = uNow * w;
    actx.putImageData(actImg, 0, 0);
    actx.setTransform(d, 0, 0, d, 0, 0);
    actx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    actx.globalAlpha = 0.16; actx.fillRect(0, 0, x, h); actx.globalAlpha = 1;
    actx.fillRect(x - 1, 0, 2, h);
  }

  // ---------------------------------------------------------------- trending
  function trending() {
    const tr = isFinite(trailU()) ? trailU() : 1, now = new Map(), prev = new Map(), total = new Map();
    for (const i of idx) {
      const u = U[i]; if (u > uNow) break;
      const n = P.narrative[i], up = HAS_UP ? (P.upvotes[i] || 0) : 0;
      total.set(n, (total.get(n) || 0) + up);
      if (u > uNow - tr) { const v = now.get(n) || {up: 0, c: 0}; v.up += up; v.c++; now.set(n, v); }
      else if (u > uNow - 2 * tr) prev.set(n, (prev.get(n) || 0) + up);
    }
    const rows = [...now].sort((a, b) => b[1].up - a[1].up || b[1].c - a[1].c).slice(0, 8);
    $("trend-h").textContent = isFinite(trailU()) ? `Trending · last ${human(tAt(uNow) - tAt(Math.max(0, uNow - tr)))}` : "Most upvoted so far";
    const ol = $("trend");
    if (!rows.length) { ol.innerHTML = `<li class="empty">Nothing posted yet in this window. Press play.</li>`; return; }
    const max = Math.max(1, rows[0][1].up);
    ol.innerHTML = rows.map(([id, v]) => {
      const n = narr.get(id), t = n && topic.get(n.topic), c = colourBy === "auth" ? "#8b93ab" : (topicColour.get(n ? n.topic : -1) || OTHER);
      const p = prev.get(id) || 0, viral = isFinite(trailU()) && v.up >= 100 && v.up > 4 * (p + 20);
      return `<li><button type="button" data-n="${id}" aria-pressed="${focus === id}">
        <span class="nm"><i style="background:${c}"></i>${esc(n ? n.label : "?")}${viral ? `<span class="viral" title="Upvotes in this window are more than 4× the window before">↑ surging</span>` : ""}</span>
        <span class="mt">▲ ${compact.format(v.up)} upvotes · ${v.c} comment${v.c > 1 ? "s" : ""}${isFinite(trailU()) ? ` · ${compact.format(total.get(id) || 0)} so far` : ""}${t ? ` · ${esc(t.label)}` : ""}</span>
        <div class="bar"><span style="width:${Math.max(3, 100 * v.up / max)}%;background:${c}"></span></div></button></li>`;
    }).join("");
  }
  $("trend").addEventListener("click", e => {
    const b = e.target.closest("[data-n]"); if (!b) return;
    const id = +b.dataset.n; focus = focus === id ? null : id; trending(); if (!playing) frame();
  });

  function legend() {
    const items = colourBy === "auth" && HAS_AUTH ? Object.values(BAND)
      : [...topicColour].slice(0, LEGEND_TOPICS).map(([t, c]) => [c, (topic.get(t) || {label: "?"}).label])
          .concat(topicColour.size > LEGEND_TOPICS ? [[OTHER, `+${topicColour.size - LEGEND_TOPICS} more topics (colours repeat)`]] : []);
    $("legend").innerHTML = items.map(([c, l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join("");
  }

  // ---------------------------------------------------------------- playback
  let last = null, lastTrend = 0, holdUntil = 0;
  function tick(clock) {
    if (playing) {
      if (last !== null) {
        if (uNow >= 1) { if (clock > holdUntil) uNow = 0; }  // hold the last frame briefly, then loop
        else {
          uNow += (clock - last) / 1000 * speed / LOOP_S;
          if (uNow >= 1) { uNow = 1; holdUntil = clock + 1800; }
        }
      }
      last = clock;
      frame();
      if (clock - lastTrend > 300) { trending(); lastTrend = clock; }
    } else last = null;
    requestAnimationFrame(tick);
  }
  function setPlaying(p) {
    playing = p; $("play").textContent = p ? "❚❚" : "▶"; $("play").setAttribute("aria-label", p ? "Pause" : "Play");
    if (p && uNow >= 1) uNow = 0;
  }
  $("play").addEventListener("click", () => setPlaying(!playing));
  addEventListener("keydown", e => { if (e.code === "Space" && !e.target.closest("select,input,button")) { e.preventDefault(); setPlaying(!playing); } });
  $("scrub").addEventListener("input", e => { uNow = +e.target.value / 1000; frame(); trending(); });
  $("mode").addEventListener("change", e => { mode = e.target.value; prepare(); frame(); trending(); });
  $("speed").addEventListener("change", e => { speed = +e.target.value; });
  $("trail").addEventListener("change", e => { trailDiv = +e.target.value; frame(); trending(); });
  $("colour").addEventListener("change", e => { colourBy = e.target.value; legend(); frame(); trending(); });
  $("sub").addEventListener("change", e => { sub = e.target.value; prepare(); frame(); trending(); });
  if (!HAS_AUTH) $("colour").querySelector('[value="auth"]').disabled = true;
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { fitView(); drawActivity(); frame(); }, 150); });

  prepare();
  if (!playing) { uNow = 1; setPlaying(false); }  // reduced motion: show the end state, still scrubbable
  frame(); trending();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
