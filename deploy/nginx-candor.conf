# Live config on the VPS (domain + certbot HTTPS), copied 2026-11-14. Certbot manages the ssl_* lines.
# setup_vps.sh installs this only on a fresh server; it never overwrites an existing site.
server {
    server_name candor-junction-2026.tech www.candor-junction-2026.tech srv2159154.hstgr.cloud;

    if ($host != candor-junction-2026.tech) { return 301 https://candor-junction-2026.tech$request_uri; }
    root /opt/candor/app/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/srv2159154.hstgr.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/srv2159154.hstgr.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://candor-junction-2026.tech$request_uri;
}
